<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Người Nhũn Vượt Ải — 2 người online</title>
<link rel="stylesheet" href="shared/shell.css">
<style>
#stage{width:100%; display:flex; flex-direction:column; align-items:center; gap:12px}
.rg-wrap{position:relative; width:min(100%, 1100px, calc((100svh - 230px) * 16 / 9)); aspect-ratio:16/9; border-radius:18px; overflow:hidden; background:#cfe3f5;
  box-shadow:0 22px 50px -24px rgba(61,139,253,.55), 0 0 0 1px rgba(0,0,0,.08); touch-action:none; user-select:none; -webkit-user-select:none; cursor:crosshair}
.rg-wrap canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.rg-rs{position:absolute; right:10px; top:10px; z-index:5; border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.55); color:#3b3552; font:600 12.5px/1 var(--ui);
  padding:7px 10px; border-radius:10px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); cursor:pointer}
.rg-rs:hover{background:rgba(255,255,255,.8)}
.rg-tpad{align-items:center}
.rg-stick{position:relative; width:132px; height:132px; border-radius:50%; background:var(--surface); border:1px solid var(--line-2); box-shadow:var(--shadow); touch-action:none; flex:none}
.rg-stick::before{content:""; position:absolute; inset:22px; border-radius:50%; border:1.5px dashed var(--line-2)}
.rg-knob{position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:var(--accent); box-shadow:0 6px 14px -6px var(--accent); pointer-events:none}
.rg-btns{display:grid; grid-template-columns:repeat(2, 64px); grid-template-rows:repeat(2, 58px); gap:9px}
.rg-btns .tbtn{width:64px; height:58px; font-size:13px; font-weight:800; line-height:1.1; text-align:center; padding:2px}
.rg-btns .tbtn.big{font-size:15px}
@media (hover:none) and (pointer:coarse){
  .rg-wrap{aspect-ratio:auto; width:100%; height:calc(100svh - 352px); min-height:280px; cursor:default}
  .rg-rs{display:none}
}
</style>
</head>
<body>
<div id="stage">
  <div class="rg-wrap" id="wrap"><canvas id="cv"></canvas><button class="rg-rs" id="rgRs" title="Về điểm hồi sinh (phím R)">↻ Hồi sinh</button></div>
  <div class="touchpad rg-tpad" id="tpad">
    <div class="rg-stick" id="stick"><div class="rg-knob" id="knob"></div></div>
    <div class="rg-btns">
      <button class="tbtn" data-k="l" aria-label="Bám tay trái">Bám<br>trái</button>
      <button class="tbtn" data-k="r" aria-label="Bám tay phải">Bám<br>phải</button>
      <button class="tbtn" data-k="rs" aria-label="Hồi sinh">↻</button>
      <button class="tbtn big" data-k="j" aria-label="Nhảy">Nhảy</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
/* Người Nhũn Vượt Ải — phối hợp 2 người, góc nhìn ngang, vật lý Matter.js.
   Mạng: CHỦ PHÒNG chạy toàn bộ mô phỏng (bước cố định 1/60 s) cho cả hai nhân vật và mọi vật thể.
   Người vào sau chỉ gửi trạng thái điều khiển (di chuyển, nhảy, bám trái/phải, hướng tay) khi thay đổi + ~12 lần/s khi ngắm.
   Chủ phòng gửi ảnh chụp gọn (vị trí/góc làm tròn) ~20 lần/s (QoS0) và sự kiện tin cậy (điểm hồi sinh, rơi, qua màn).
   Máy người vào sau vẽ trễ ~100 ms và nội suy giữa hai ảnh chụp. */

const M = window.Matter;
const { Engine, Bodies, Body, Composite, Constraint, Query } = M;
const DT = 1000 / 60, DT2 = DT * DT, GF = 0.001;          // GF: lực trọng trường trên 1 đơn vị khối lượng
const RUN = 2.8, JUMP_V = 7, SNAP_EVERY = 3, INTERP_TICKS = 6;
const CAT_STATIC = 1, CAT_DYN = 2, CAT_CHAR = 4, CAT_ARM = 8, CAT_MISC = 16;
const C_HOST = '#d8cbb3', C_GUEST = '#ffc21f';
const PAL = [
  { main: '#f8f4ec', shade: '#d9cfbe', deep: '#b7ab97', shoe: '#8d7f9e' },
  { main: '#ffd54a', shade: '#eaa925', deep: '#c98516', shoe: '#6f5aa8' }
];
const SIGC = ['#4fc3e8', '#ff8fb8', '#a48cff', '#7fd49a'];

/* ---------- các màn ----------
   solids: [x, y(top), w, h, loại: g=đảo cỏ, s=đá, w=gỗ, u=độ sâu chóp đá phía dưới]
   need: danh sách tín hiệu, chỉ cần 1 tín hiệu bật (p# = bàn nhấn, l# = cần gạt) */
const LEVELS = [
  {
    name: 'Bình minh trên mây', w: 2700, deathY: 980, sky: 0,
    spawn: [140, 600],
    solids: [
      [-200, 600, 640, 120, 'g', 150], [440, 480, 350, 160, 'g', 170], [790, 529, 58, 111, 's', 90], [848, 480, 452, 160, 'g', 190],
      [900, -400, 120, 730, 's', 0],
      [1400, 520, 420, 130, 'g', 170], [1920, 290, 780, 310, 'g', 220]
    ],
    boxes: [[690, 480, 48, 2.6, 'w']],
    plates: [[792, 529, 54, 0]],
    doors: [{ x: 940, y: 330, w: 40, h: 150, dx: 0, dy: -140, need: ['p0'], c: 0 }],
    movers: [{ x: 1822, y: 520, w: 94, h: 16, dx: 0, dy: -230, need: ['l0'], c: 1, lift: 1 }],
    bridges: [], seesaws: [], ropes: [],
    levers: [{ x: 2030, y: 290, c: 1 }],
    cps: [[140, 600], [600, 480], [1480, 520], [2080, 290]],
    exit: [2520, 290],
    signs: [
      [300, 455, 'Bám mép rồi giữ W để đu người lên\nGiữ chuột trái / phải (J / K) để bám', 'Giữ nút Bám để bám mép\nGiữ Nhảy để đu người lên'],
      [730, 360, 'Đẩy thùng xuống hố bàn nhấn để mở cửa', 'Đẩy thùng xuống hố bàn nhấn để mở cửa'],
      [1350, 400, 'Lấy đà rồi nhảy qua!', 'Lấy đà rồi nhảy qua!'],
      [1700, 360, 'Vách quá cao: đứng lên đầu bạn để với tới,\nrồi gạt cần trên đỉnh để hạ thang máy', 'Vách quá cao: đứng lên đầu bạn để với tới,\nrồi gạt cần trên đỉnh để hạ thang máy']
    ]
  },
  {
    name: 'Bập bênh và cầu gỗ', w: 2760, deathY: 1000, sky: 1,
    spawn: [110, 600],
    solids: [
      [-200, 600, 1700, 130, 'g', 200], [300, 440, 120, 26, 'w', 30],
      [760, 370, 500, 130, 'g', 0],
      [1800, 600, 452, 130, 'g', 200], [2252, 666, 72, 64, 's', 110], [2324, 600, 436, 130, 'g', 200], [2430, -400, 80, 830, 's', 0]
    ],
    boxes: [[336, 440, 44, 3.2, 'w'], [2060, 600, 62, 10, 'h']],
    plates: [[1900, 600, 76, 0], [2254, 666, 68, 1]],
    doors: [
      { x: 772, y: 500, w: 34, h: 100, dx: 0, dy: -96, need: ['l0'], c: 2 },
      { x: 2450, y: 430, w: 40, h: 170, dx: 0, dy: -160, need: ['p1'], c: 1 }
    ],
    movers: [],
    bridges: [{ px: 1500, py: 608, len: 300, th: 16, a0: -Math.PI / 2, a1: 0, need: ['l1', 'p0'], c: 0 }],
    seesaws: [{ x: 590, y: 545, len: 320, a: -0.3 }],
    ropes: [],
    levers: [{ x: 1000, y: 370, c: 2 }, { x: 1410, y: 600, c: 0, spring: 1 }],
    cps: [[110, 600], [1100, 600], [1880, 600]],
    exit: [2620, 600],
    signs: [
      [360, 360, 'Một người đứng đầu phải bập bênh,\nngười kia đẩy thùng xuống đầu trái rồi nhảy theo', 'Một người đứng đầu phải bập bênh,\nngười kia đẩy thùng xuống đầu trái rồi nhảy theo'],
      [1000, 270, 'Gạt cần mở đường hầm', 'Gạt cần mở đường hầm'],
      [1420, 470, 'Giữ chặt cần gạt để hạ cầu', 'Giữ chặt cần gạt để hạ cầu'],
      [2150, 470, 'Khối đá nặng: cần cả hai cùng đẩy xuống hố', 'Khối đá nặng: cần cả hai cùng đẩy xuống hố']
    ]
  },
  {
    name: 'Đu dây qua vực', w: 3100, deathY: 1000, sky: 2,
    spawn: [130, 600],
    solids: [
      [-200, 600, 900, 130, 'g', 180], [740, 130, 100, 60, 's', 60],
      [930, 600, 780, 130, 'g', 190],
      [2000, 600, 1100, 130, 'g', 200], [2500, 370, 600, 230, 'g', 0]
    ],
    boxes: [],
    plates: [[1560, 600, 80, 0]],
    doors: [],
    movers: [{ x: 1712, y: 600, w: 120, h: 18, dx: 170, dy: 0, need: ['p0', 'l0'], c: 0 }],
    bridges: [{ px: 2500, py: 362, len: 330, th: 16, a0: Math.PI / 2, a1: Math.PI - 0.8, need: ['l1'], c: 1 }],
    seesaws: [],
    ropes: [{ x: 790, y: 190, len: 300 }],
    levers: [{ x: 2090, y: 600, c: 0 }, { x: 2860, y: 370, c: 1 }],
    cps: [[130, 600], [1070, 600], [2100, 600], [2860, 370]],
    exit: [3000, 370],
    signs: [
      [420, 470, 'Nhảy bám lấy dây, đung đưa rồi buông tay', 'Nhảy bám lấy dây, đung đưa rồi buông tay'],
      [1540, 470, 'Một người giữ bàn nhấn,\nngười kia cưỡi bệ đá', 'Một người giữ bàn nhấn,\nngười kia cưỡi bệ đá'],
      [2300, 470, 'Kiệu nhau lên vách rồi hạ cầu dốc', 'Kiệu nhau lên vách rồi hạ cầu dốc']
    ]
  }
];

/* Hai nhân vật đi xuyên qua nhau theo chiều ngang (để không chặn đường nhau),
   nhưng vẫn va chạm theo chiều dọc (đứng lên đầu nhau để kiệu). */
(() => {
  const R = M.Resolver, orig = R.preSolvePosition;
  R.preSolvePosition = function (pairs) {
    for (let i = 0; i < pairs.length; i++) {
      const p = pairs[i]; if (!p.isActive) continue;
      const a = p.bodyA.parent.rd, b = p.bodyB.parent.rd;
      if (a && b && a.kind === 'char' && b.kind === 'char' && a.ci !== b.ci) {
        const ca = G.chars[a.ci], cb = G.chars[b.ci];
        if (ca && cb && Math.abs(ca.trunk.position.y - cb.trunk.position.y) < 50) p.isActive = false;
      }
    }
    return orig.apply(this, arguments);
  };
})();

/* ---------- canvas ---------- */
const cv = document.getElementById('cv'), cx = cv.getContext('2d'), wrap = document.getElementById('wrap');
let dpr = 1, CW = 1, CH = 1, S = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = wrap.getBoundingClientRect();
  CW = Math.max(1, Math.round(r.width * dpr)); CH = Math.max(1, Math.round(r.height * dpr));
  cv.width = CW; cv.height = CH;
  S = Math.sqrt((r.width * r.height) / (isTouch && r.height > r.width ? 720 * 400 : 1000 * 560));      // tỉ lệ theo diện tích: luôn thấy ~1000×560 đơn vị (màn dọc: phóng to hơn)
  S = Math.max(S, r.width / 1500, 0.05);
}
const isTouch = matchMedia('(hover:none) and (pointer:coarse)').matches;

/* ---------- trạng thái ---------- */
const G = {
  phase: 'idle', lv: 0, world: null, engine: null, tick: 0, ltick: 0, solo: false,
  chars: [], inputs: [blankInput(), blankInput()], cp: 0, falls: [0, 0], total: 0,
  snaps: [], clockOff: null, lastSnapK: -1, parts: [], cam: { x: 500, y: 400, init: false },
  timers: [], fade: 0, exitT: 0, t: 0, bannerShown: false
};
function blankInput() { return { mx: 0, jh: 0, jc: 0, l: 0, r: 0, a: -0.6, dn: 0 }; }
const sim = () => Shell.isHost || G.solo;
const myIdx = () => (G.solo ? 0 : Shell.isHost ? 0 : 1);
function later(ms, fn) { const id = setTimeout(() => { G.timers = G.timers.filter(x => x !== id); fn(); }, ms); G.timers.push(id); }
function clearTimers() { G.timers.forEach(clearTimeout); G.timers = []; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const rot = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: p.x * c - p.y * s, y: p.x * s + p.y * c }; };
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- dựng thế giới ---------- */
function buildWorld(lv) {
  const L = LEVELS[lv];
  const engine = Engine.create({ positionIterations: 8, velocityIterations: 6, constraintIterations: 4, enableSleeping: false });
  engine.gravity.y = 1;
  const W = { L, lv, statics: [], dyn: [], boxes: [], plates: [], doors: [], movers: [], bridges: [], seesaws: [], ropes: [], levers: [], kin: [], deco: [] };
  const add = b => Composite.add(engine.world, b);
  const sopt = () => ({ isStatic: true, friction: 0.9, collisionFilter: { category: CAT_STATIC, mask: 0xffff } });
  L.solids.forEach(([x, y, w, h, t, u]) => {
    const b = Bodies.rectangle(x + w / 2, y + h / 2, w, h, sopt());
    b.rd = { kind: 'solid', x, y, w, h, t, u: u || 0 };
    W.statics.push(b); add(b);
  });
  L.boxes.forEach(([x, y, s, m, t], i) => {
    const b = Bodies.rectangle(x, y - s / 2, s, s, { chamfer: { radius: t === 'h' ? 5 : 4 }, friction: t === 'h' ? 0.35 : 0.7, frictionStatic: 0.6, frictionAir: 0.01,
      collisionFilter: { category: CAT_DYN, mask: CAT_STATIC | CAT_DYN | CAT_CHAR | CAT_ARM } });
    Body.setMass(b, m);
    b.rd = { kind: 'box', t, s, home: { x, y: y - s / 2 }, i };
    W.boxes.push(b); W.dyn.push(b); add(b);
  });
  L.plates.forEach(([x, y, w, id]) => W.plates.push({ x, y, w, id, on: false, press: 0 }));
  L.doors.forEach(d => {
    const b = Bodies.rectangle(d.x + d.w / 2, d.y + d.h / 2, d.w, d.h, sopt());
    b.rd = { kind: 'door', d };
    const o = { type: 'door', d, b, s: 0, base: { x: d.x + d.w / 2, y: d.y + d.h / 2 } };
    W.doors.push(o); W.kin.push(o); add(b);
  });
  L.movers.forEach(d => {
    const b = Bodies.rectangle(d.x + d.w / 2, d.y + d.h / 2, d.w, d.h, sopt());
    b.rd = { kind: 'mover', d };
    const o = { type: 'mover', d, b, s: 0, dir: 1, wait: 0, base: { x: d.x + d.w / 2, y: d.y + d.h / 2 }, prev: { x: d.x + d.w / 2, y: d.y + d.h / 2 } };
    W.movers.push(o); W.kin.push(o); add(b);
  });
  L.bridges.forEach(d => {
    const b = Bodies.rectangle(d.px, d.py, d.len, d.th, sopt());
    b.rd = { kind: 'bridge', d };
    const o = { type: 'bridge', d, b, s: 0 };
    W.bridges.push(o); W.kin.push(o); add(b); applyKin(o);
  });
  L.seesaws.forEach(d => {
    const pl = Bodies.rectangle(d.x, d.y, d.len, 14, { chamfer: { radius: 5 } });
    const lipL = Bodies.rectangle(d.x - d.len / 2 + 5, d.y - 10, 10, 8, { chamfer: { radius: 3 } });
    const lipR = Bodies.rectangle(d.x + d.len / 2 - 5, d.y - 10, 10, 8, { chamfer: { radius: 3 } });
    const b = Body.create({ parts: [pl, lipL, lipR], friction: 0.9, frictionAir: 0.02,
      collisionFilter: { category: CAT_DYN, mask: CAT_STATIC | CAT_DYN | CAT_CHAR | CAT_ARM } });
    Body.setMass(b, 2.2);
    b.rd0 = { x: b.position.x - d.x, y: b.position.y - d.y };
    Body.setAngle(b, d.a || 0);
    b.rd = { kind: 'seesaw', d };
    const c = Constraint.create({ pointA: { x: d.x, y: d.y }, bodyB: b, pointB: rot({ x: -b.rd0.x, y: -b.rd0.y }, d.a || 0), length: 0, stiffness: 1 });
    W.seesaws.push(b); W.dyn.push(b); add(b); add(c);
  });
  L.ropes.forEach(d => {
    const b = Bodies.rectangle(d.x, d.y + d.len / 2, 8, d.len, { frictionAir: 0.004, collisionFilter: { category: CAT_MISC, mask: 0 } });
    Body.setMass(b, 1.6);
    b.rd = { kind: 'rope', d };
    const c = Constraint.create({ pointA: { x: d.x, y: d.y }, bodyB: b, pointB: { x: 0, y: -d.len / 2 }, length: 0, stiffness: 1 });
    W.ropes.push(b); W.dyn.push(b); add(b); add(c);
  });
  L.levers.forEach((d, i) => {
    const b = Bodies.rectangle(d.x, d.y - 24, 8, 48, { chamfer: { radius: 4 }, frictionAir: 0.08,
      collisionFilter: { category: CAT_MISC, mask: d.spring ? 0 : CAT_CHAR } });
    Body.setMass(b, 0.6);
    const a0 = -0.6; Body.setAngle(b, 0); placeLever(b, d, a0);
    b.rd = { kind: 'lever', d, i };
    const c = Constraint.create({ pointA: { x: d.x, y: d.y - 2 }, bodyB: b, pointB: { x: 0, y: 22 }, length: 0, stiffness: 1 });
    const o = { d, b, on: false, i };
    W.levers.push(o); W.dyn.push(b); add(b); add(c);
  });
  W.sig = {};
  // trang trí: búi cỏ, hoa, cây nhỏ
  const R = rng(lv * 977 + 13);
  W.statics.forEach(b => {
    const r = b.rd; if (r.t !== 'g') return;
    for (let x = r.x + 18; x < r.x + r.w - 14; x += 26 + R() * 46) {
      const k = R();
      W.deco.push({ x, y: r.y, k: k < .55 ? 'tuft' : k < .85 ? 'flower' : 'stone', c: R(), s: .7 + R() * .6 });
    }
  });
  // đảo xa & mây (thị sai)
  W.far = []; W.clouds = [];
  for (let i = 0; i < 10; i++) W.far.push({ x: i * 420 + R() * 260 - 200, y: 120 + R() * 260, w: 90 + R() * 170, d: .12 + R() * .16, tree: R() < .6 });
  for (let i = 0; i < 16; i++) W.clouds.push({ x: R() * (L.w + 800) - 400, y: R() * 520 - 120, s: .6 + R() * .9, d: .3 + R() * .35, v: 4 + R() * 8 });
  W.engine = engine;
  return W;
}
function placeLever(b, d, a) {
  Body.setAngle(b, a);
  const p = rot({ x: 0, y: -24 }, a);
  Body.setPosition(b, { x: d.x + p.x, y: d.y - 2 + p.y });
  Body.setVelocity(b, { x: 0, y: 0 }); Body.setAngularVelocity(b, 0);
}
function applyKin(o) {
  const ease = t => t * t * (3 - 2 * t);
  if (o.type === 'door') {
    const e = ease(o.s);
    Body.setPosition(o.b, { x: o.base.x + o.d.dx * e, y: o.base.y + o.d.dy * e });
  } else if (o.type === 'mover') {
    const e = ease(o.s);
    Body.setPosition(o.b, { x: o.base.x + o.d.dx * e, y: o.base.y + o.d.dy * e });
  } else if (o.type === 'bridge') {
    const d = o.d, a = d.a0 + (d.a1 - d.a0) * ease(o.s);
    Body.setAngle(o.b, a);
    Body.setPosition(o.b, { x: d.px + Math.cos(a) * d.len / 2, y: d.py + Math.sin(a) * d.len / 2 });
  }
}

/* ---------- nhân vật ---------- */
const TORSO_H = 30, HEAD_DY = -27, LEG = 18, FOOT_R = 9;
const BASE_TO_TORSO = TORSO_H / 2 + LEG + FOOT_R;          // từ đáy bàn chân tới tâm thân
function makeChar(W, i, x, footY) {
  const y = footY - BASE_TO_TORSO;
  const group = Body.nextGroup(true);
  const filt = { group, category: CAT_CHAR, mask: CAT_STATIC | CAT_DYN | CAT_CHAR | CAT_ARM | CAT_MISC };
  const torso = Bodies.rectangle(x, y, 26, TORSO_H, { chamfer: { radius: 11 } });
  const head = Bodies.rectangle(x, y + HEAD_DY, 28, 27, { chamfer: { radius: [9, 9, 12, 12] } });   // đỉnh đầu hơi phẳng để bạn đứng lên được

  cx.fillStyle = dk ? '#6d6890' : '#b9b3cf'; rr(x - 40, y - 8, 80, 10, 5); cx.fill();
  if (G.inExit) G.inExit.forEach((v, i) => { if (v) { cx.fillStyle = PAL[i].main; cx.beginPath(); cx.arc(x - 12 + i * 24, y - 116, 5, 0, 7); cx.fill(); } });
}
function drawChar(c, dk) {
  const P = PAL[c.i], t = c.trunk, ang = t.angle, v = c.vis;
  const dead = sim() ? c.dead : c.netDead;
  const toW = l => { const p = rot(l, ang); return { x: t.position.x + p.x, y: t.position.y + p.y }; };
  const torso = toW(c.tl), head = toW(c.hl), sh = toW(c.sh);
  const hipL = toW({ x: c.tl.x - 6, y: c.tl.y + 11 }), hipR = toW({ x: c.tl.x + 6, y: c.tl.y + 11 });
  const f = c.foot.position, face = c.face;
  const g = v.g;
  const grabs = sim() ? c.arms.map(a => !!a.grab) : (c.netGrab || [false, false]);
  const heldB = sim() ? [G.inputs[c.i].l, G.inputs[c.i].r] : (c.netHeld || [0, 0]);
  const sq = v.sq;
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  const arm = (k, col) => {
    const a = c.arms[k], hp = handW(a);
    cx.strokeStyle = col; cx.lineWidth = 9.5;
    const mx = (sh.x + hp.x) / 2 + (hp.y - sh.y) * .08 * face, my = (sh.y + hp.y) / 2 - (hp.x - sh.x) * .08 * face;
    cx.beginPath(); cx.moveTo(sh.x, sh.y); cx.quadraticCurveTo(mx, my, hp.x, hp.y); cx.stroke();
    cx.fillStyle = col; cx.beginPath(); cx.arc(hp.x, hp.y, grabs[k] ? 5.5 : 6.5, 0, 7); cx.fill();
    if (grabs[k]) { cx.strokeStyle = SIGC[k ? 0 : 1]; cx.lineWidth = 2; cx.beginPath(); cx.arc(hp.x, hp.y, 7.5, 0, 7); cx.stroke(); }
    else if (heldB[k]) { cx.strokeStyle = 'rgba(255,255,255,.8)'; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(hp.x, hp.y, 8.5, 0, 7); cx.stroke(); }
  };
  cx.globalAlpha = dead ? .55 : 1;
  arm(0, P.shade);
  // chân
  const ph = v.ph, moving = g && Math.abs(v.vx || 0) > 30;
  const feet = [0, 1].map(k => {
    const p = ph + k * Math.PI;
    if (moving) return { x: f.x + Math.sin(p) * 9, y: f.y + FOOT_R - 3 - Math.max(0, Math.cos(p)) * 6 };
    if (!g) return { x: f.x + (k ? 6 : -5) * face, y: f.y + FOOT_R - 4 - (k ? 4 : 0) };
    return { x: f.x + (k ? 6 : -6), y: f.y + FOOT_R - 3 };
  });
  [[hipL, feet[0], P.shade], [hipR, feet[1], P.main]].forEach(([h, ft, col], k) => {
    cx.strokeStyle = col; cx.lineWidth = 9;
    const kx = (h.x + ft.x) / 2 + 4 * face, ky = (h.y + ft.y) / 2;
    cx.beginPath(); cx.moveTo(h.x, h.y); cx.quadraticCurveTo(kx, ky, ft.x, ft.y); cx.stroke();
    cx.fillStyle = P.shoe; cx.beginPath(); cx.ellipse(ft.x + 2.5 * face, ft.y + 0.5, 7, 4.2, 0, 0, 7); cx.fill();
  });
  // thân (méo khi tiếp đất)
  cx.save(); cx.translate(torso.x, torso.y + 15); cx.rotate(ang); cx.scale(1 + sq * .22, 1 - sq * .2); cx.translate(0, -15);
  const tg = cx.createLinearGradient(-13, 0, 13, 0);
  tg.addColorStop(0, P.main); tg.addColorStop(1, P.shade);
  cx.fillStyle = tg; rr(-13, -15, 26, 30, 12); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,.35)'; rr(-8 * face - 2, -10, 5, 14, 3); cx.fill();
  cx.restore();
  // đầu
  const hy = head.y + sq * 5;
  const hg = cx.createRadialGradient(head.x - 4 * face, hy - 5, 2, head.x, hy, 16);
  hg.addColorStop(0, '#ffffff'); hg.addColorStop(.25, P.main); hg.addColorStop(1, P.shade);
  cx.fillStyle = hg; cx.beginPath(); cx.ellipse(head.x, hy, 15 * (1 + sq * .1), 14.5 * (1 - sq * .08), ang, 0, 7); cx.fill();
  // mặt
  const look = { x: Math.cos(c.aim) * 1.6, y: Math.sin(c.aim) * 1.4 };
  const fx = head.x + face * 3.5, fy = hy + 1;
  const vy = v.vy || 0;
  cx.fillStyle = '#3b3452';
  if (v.blink < 0 || dead) { cx.strokeStyle = '#3b3452'; cx.lineWidth = 1.8; cx.beginPath(); cx.moveTo(fx - 7, fy - 2); cx.lineTo(fx - 3, fy - 2); cx.moveTo(fx + 3, fy - 2); cx.lineTo(fx + 7, fy - 2); cx.stroke(); }
  else { cx.beginPath(); cx.ellipse(fx - 5 + look.x, fy - 2 + look.y, 2, 2.8, 0, 0, 7); cx.ellipse(fx + 5 + look.x, fy - 2 + look.y, 2, 2.8, 0, 0, 7); cx.fill(); }
  cx.fillStyle = 'rgba(255,130,150,.4)'; cx.beginPath(); cx.arc(fx - 9, fy + 3, 2.8, 0, 7); cx.arc(fx + 9, fy + 3, 2.8, 0, 7); cx.fill();
  cx.strokeStyle = '#3b3452'; cx.lineWidth = 1.6;
  if (!g && vy > 420 || dead) { cx.beginPath(); cx.ellipse(fx, fy + 5, 2.4, 3, 0, 0, 7); cx.stroke(); }
  else if (grabs[0] || grabs[1]) { cx.beginPath(); cx.moveTo(fx - 3, fy + 5); cx.lineTo(fx + 3, fy + 5); cx.stroke(); }
  else { cx.beginPath(); cx.arc(fx, fy + 3, 3.2, .3, Math.PI - .3); cx.stroke(); }
  arm(1, P.main);
  cx.globalAlpha = 1;
  // tên
  const nm = c.i === myIdx() ? (Shell.myName || 'Bạn') : (Shell.oppName || 'Đồng đội');
  ctxFont(12, 700); cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const tw = cx.measureText(nm).width + 14;
  cx.fillStyle = dk ? 'rgba(20,16,40,.5)' : 'rgba(255,255,255,.6)'; rr(head.x - tw / 2, hy - 40, tw, 17, 8); cx.fill();
  cx.fillStyle = c.i ? '#c98516' : (dk ? '#fff' : '#6b6280'); cx.fillText(nm, head.x, hy - 31.5);
}

/* ---------- khởi động ---------- */
new ResizeObserver(resize).observe(wrap); resize();
requestAnimationFrame(frame);

Shell.init({
  id: 'ragdoll',
  colors: [C_HOST, C_GUEST],
  sides: ['Bánh Bao', 'Bánh Chuối'],
  howto: [
    'Hai bạn là hai nhân vật mềm oặt, lắc lư. Cùng nhau đưa <b>cả hai</b> tới cổng sáng cuối mỗi ải.',
    '<b>Giữ chuột trái / phải</b> (hoặc <b>J / K</b>): tay trái / phải vươn về phía con trỏ và <b>bám chặt</b> thứ nó chạm vào — mép đá, thùng, cần gạt, dây, hoặc bạn mình. Thả nút để buông.',
    'Đang bám mà <b>giữ W</b> sẽ đu người lên mép. Đứng lên đầu bạn để với tới vách cao, kéo thùng lên bàn nhấn để mở cửa.',
    'Rơi khỏi đảo sẽ hồi sinh ở đèn lồng gần nhất (bấm <b>R</b> để tự hồi sinh khi bị kẹt).',
    'Qua 3 ải nhanh nhất có thể!'
  ],
  keys: [[['A', 'D'], 'đi'], [['W', 'Space'], 'nhảy / đu lên'], ['Chuột', 'ngắm tay'], [['Chuột trái', 'Chuột phải'], 'bám tay trái / phải'], [['J', 'K'], 'bám bằng phím'], ['R', 'hồi sinh']],
  onStart() { resetMatch(); if (Shell.isHost) hostStart(); },
  onRematch() { resetMatch(); if (Shell.isHost) hostStart(); },
  onStop() { clearTimers(); G.phase = 'idle'; G.world = null; },
  onTheme() {},
  onMessage(m) {
    switch (m.t) {
      case 'start': if (!Shell.isHost) { resetMatch(); } break;
      case 'lvl': if (!Shell.isHost) loadLevel(m.lv, m.lv === 0 || !G.world); break;
      case 's': if (!Shell.isHost) onSnap(m); break;
      case 'i': if (Shell.isHost && !G.botCtl) { const q = G.inputs[1]; q.mx = clamp(+m.m || 0, -1, 1); q.jh = m.h ? 1 : 0; q.jc = m.c | 0; q.l = m.l ? 1 : 0; q.r = m.r ? 1 : 0; q.a = (+m.a || 0) / 100; } break;
      case 'rq': if (Shell.isHost && G.phase === 'play' && m.lv === G.lv) killChar(G.chars[1], false); break;
      case 'cp': if (!Shell.isHost && G.world && m.lv === G.lv && m.n > G.cp) { G.cp = m.n; onCp(m.n); } break;
      case 'fall': if (!Shell.isHost && G.world && m.lv === G.lv) onFall(m.i, m.f); break;
      case 'done': if (!Shell.isHost && G.world) onDone(m); break;
      case 'end': if (!Shell.isHost) onEnd(m); break;
    }
  }
});
hud();
// móc kiểm thử
window.__rd = { G, LEVELS, step, loadLevel, killChar, placeChar, handW, shoulderW, consts: { DT, RUN, JUMP_V },
  solo(lv) { G.solo = true; resetMatch(); loadLevel(lv || 0, false); G.phase = 'play'; } };
})();
