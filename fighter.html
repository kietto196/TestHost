<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đại Chiến Nhẫn Kiếm — 2 người online</title>
<link rel="stylesheet" href="shared/shell.css">
<style>
#stage{width:100%; display:flex; flex-direction:column; align-items:center; gap:10px}
.fg-wrap{--ar:1.7778; position:relative; width:min(100%, 1040px, calc((100svh - 236px) * var(--ar)))}
.fg-arena{position:relative; width:100%; aspect-ratio:var(--ar); border-radius:16px; overflow:hidden; background:#1a1230;
  box-shadow:0 24px 50px -24px rgba(255,59,92,.55), 0 0 0 1px rgba(0,0,0,.12); touch-action:none; user-select:none; -webkit-user-select:none}
.fg-arena canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
@media (hover:none) and (pointer:coarse){ .fg-wrap{width:min(100%, 1040px, calc((100svh - 410px) * var(--ar)))} }

/* chọn nhân vật */
.fg-sel{width:100%; border-radius:18px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:14px}
.fg-sel-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.fg-sel-head h2{font:800 28px/1 var(--display); margin:0}
.fg-sel-head p{margin:4px 0 0; color:var(--muted); font-size:13.5px}
.fg-clock{--p:100; width:54px; height:54px; flex:none; border-radius:50%; display:grid; place-items:center; position:relative;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0)}
.fg-clock::before{content:""; position:absolute; inset:5px; border-radius:50%; background:var(--surface)}
.fg-clock span{position:relative; font:800 22px var(--display)}
.fg-sel-main{display:grid; grid-template-columns:1fr minmax(0,1.3fr) 1fr; gap:12px; align-items:stretch}
.fg-prev{--cc:#666; position:relative; border-radius:16px; overflow:hidden; color:#fff; display:flex; flex-direction:column;
  background:radial-gradient(120% 70% at 50% 30%, color-mix(in srgb, var(--cc) 60%, #241a38), #120c1d 80%); box-shadow:inset 0 0 0 2px var(--pc, transparent)}
.fg-prev canvas{width:100%; height:clamp(120px, 26svh, 230px); flex:none; display:block}
.fg-pinfo{padding:4px 12px 12px; margin-top:auto; background:linear-gradient(transparent, rgba(0,0,0,.5))}
.fg-pinfo small{font-weight:800; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--pc); filter:brightness(1.35)}
.fg-pinfo b{display:block; font:800 24px/1.05 var(--display)}
.fg-pinfo em{font-style:normal; font-size:13px; opacity:.85}
.fg-stats{display:grid; grid-template-columns:auto 1fr; gap:2px 8px; margin-top:8px; font-size:11.5px; align-items:center; opacity:.95}
.fg-stats i{display:flex; gap:3px} .fg-stats i s{width:14px; height:6px; border-radius:3px; background:rgba(255,255,255,.18)} .fg-stats i s.on{background:var(--cc); filter:brightness(1.3)}
.fg-moves{margin:8px 0 0; padding:0; list-style:none; font-size:12px; line-height:1.55; opacity:.95}
.fg-moves kbd{font-size:10.5px; padding:1px 5px; min-width:18px; color:#fff; background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25)}
.fg-state{position:absolute; top:10px; right:10px; font:800 12px var(--ui); padding:5px 10px; border-radius:999px; background:rgba(0,0,0,.45); color:#fff}
.fg-state.on{background:var(--good)}
.fg-q{position:absolute; inset:0 0 40% 0; display:grid; place-items:center; font:800 64px var(--display); opacity:.35}
.fg-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.fg-card{--cc:#666; position:relative; border:0; padding:0; border-radius:14px; overflow:hidden; color:#fff; text-align:left; cursor:pointer;
  background:radial-gradient(110% 80% at 50% 25%, color-mix(in srgb, var(--cc) 62%, #2a1f3d), #150f22 85%); box-shadow:inset 0 0 0 2px rgba(255,255,255,.07); transition:transform .15s, box-shadow .15s}
.fg-card:hover{transform:translateY(-2px)}
.fg-card canvas{width:100%; height:clamp(90px, 17svh, 170px); display:block}
.fg-card .nm{position:absolute; left:10px; right:8px; bottom:7px}
.fg-card .nm b{display:block; font:800 18px/1.05 var(--display); text-shadow:0 2px 0 rgba(0,0,0,.35)}
.fg-card .nm small{font-size:11.5px; opacity:.85}
.fg-card .tg{position:absolute; top:7px; font:800 10.5px var(--ui); padding:3px 7px; border-radius:999px; color:#fff; display:none; letter-spacing:.03em}
.fg-card .tg.me{left:7px; background:var(--mc)} .fg-card .tg.op{right:7px; background:var(--oc)}
.fg-card.me{box-shadow:inset 0 0 0 3px var(--mc), 0 10px 22px -12px var(--mc)} .fg-card.me .tg.me{display:block}
.fg-card.op .tg.op{display:block}
.fg-card.me.op{box-shadow:inset 0 0 0 3px var(--mc), inset 0 0 0 6px var(--oc)}
.fg-sel.locked .fg-card:not(.me){opacity:.55}
.fg-sel-foot{display:flex; gap:10px; align-items:center}
.fg-sel-foot .sh-btn{flex:1}
.fg-sel-foot p{margin:0; font-size:12.5px; color:var(--muted); flex:1.2; line-height:1.4}
@media (max-width:760px){
  .fg-sel{padding:12px; gap:10px}
  .fg-sel-head h2{font-size:22px}
  .fg-sel-main{grid-template-columns:1fr 1fr; gap:8px}
  .fg-grid{grid-column:1 / -1; order:3; grid-template-columns:repeat(4, 1fr); gap:6px}
  .fg-prev{min-height:0}
  .fg-prev canvas{height:120px}
  .fg-pinfo{padding:6px 9px 9px} .fg-pinfo b{font-size:18px} .fg-pinfo em{font-size:11.5px}
  .fg-moves, .fg-stats{display:none}
  .fg-card canvas{height:86px}
  .fg-card .nm{left:6px; bottom:5px} .fg-card .nm b{font-size:13px} .fg-card .nm small{display:none}
  .fg-card .tg{font-size:9px; padding:2px 5px; top:4px} .fg-card .tg.me{left:4px} .fg-card .tg.op{right:4px}
  .fg-sel-foot p{display:none}
  .fg-q{font-size:44px}
}

/* điều khiển cảm ứng */
.fg-touch{align-items:center}
.fg-touch.off{display:none !important}
.fg-dpad{position:relative; width:156px; height:156px; flex:none; touch-action:none}
.fg-dpad .tbtn{position:absolute; width:54px; height:54px; font-size:19px; pointer-events:none}
.fg-dpad .u{left:51px; top:0} .fg-dpad .d{left:51px; bottom:0; font-size:13px; font-weight:800} .fg-dpad .l{left:0; top:51px} .fg-dpad .r{right:0; top:51px}
.fg-dpad::after{content:""; position:absolute; left:61px; top:61px; width:34px; height:34px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line)}
.fg-acts{display:grid; grid-template-columns:repeat(3, 58px); grid-template-rows:repeat(2, 58px); gap:8px; grid-template-areas:"u i j" "k l j"}
.fg-acts .tbtn{width:auto; height:auto; font:800 13px/1 var(--display); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:0}
.fg-acts .tbtn small{font:700 9.5px var(--ui); opacity:.7}
.fg-acts [data-k="atk"]{grid-area:j; border-radius:22px; font-size:17px; background:linear-gradient(160deg,#ff6a7f,#ff2e55); color:#fff; border:0}
.fg-acts [data-k="dash"]{grid-area:k} .fg-acts [data-k="sp1"]{grid-area:l} .fg-acts [data-k="sp2"]{grid-area:u}
.fg-acts [data-k="ult"]{grid-area:i; background:linear-gradient(160deg,#ffd75e,#ff9b1f); color:#3a2000; border:0}
.fg-acts [data-k="ult"].dim{filter:grayscale(.8); opacity:.6}
.fg-acts .tbtn.on{filter:brightness(.85); transform:scale(.95)}
</style>
</head>
<body>
<div id="stage">
  <div class="fg-wrap" id="wrap">
    <div class="fg-arena" id="arena"><canvas id="cv"></canvas></div>
    <section class="fg-sel hidden" id="sel">
      <div class="fg-sel-head">
        <div><h2>Chọn nhân vật</h2><p id="selSub">Chọn một võ giả rồi bấm Sẵn sàng. Hết giờ sẽ tự chọn.</p></div>
        <div class="fg-clock" id="selClock"><span id="selTime">15</span></div>
      </div>
      <div class="fg-sel-main">
        <div class="fg-prev" id="pvMe"><canvas></canvas><div class="fg-state"></div>
          <div class="fg-pinfo"><small>Bạn</small><b></b><em></em><div class="fg-stats"></div><ul class="fg-moves"></ul></div></div>
        <div class="fg-grid" id="selGrid"></div>
        <div class="fg-prev" id="pvOpp"><canvas></canvas><div class="fg-q">?</div><div class="fg-state"></div>

      </div>

        <button class="sh-btn sh-primary" id="readyBtn">Sẵn sàng!</button></div>
    </section>
  </div>
  <div class="touchpad fg-touch" id="tpad">
    <div class="fg-dpad" id="dpad"><div class="tbtn u">▲</div><div class="tbtn l">◀</div><div class="tbtn r">▶</div><div class="tbtn d">ĐỠ</div></div>
    <div class="fg-acts">
      <button class="tbtn" data-k="sp2" aria-label="Chiêu lao">Đột<small>U</small></button>
      <button class="tbtn" data-k="ult" aria-label="Tuyệt chiêu">Tuyệt<small>I</small></button>
      <button class="tbtn" data-k="atk" aria-label="Đánh">Đánh<small>J</small></button>
      <button class="tbtn" data-k="dash" aria-label="Lướt">Lướt<small>K</small></button>
      <button class="tbtn" data-k="sp1" aria-label="Chiêu xa">Chiêu<small>L</small></button>
    </div>
  </div>
</div>

<script src="shared/games.js"></script>
<script src="shared/net.js"></script>
<script src="shared/shell.js"></script>
<script>
(() => {
'use strict';
/* ============================================================================
   Đại Chiến Nhẫn Kiếm — đối kháng 1v1.
   Toạ độ thế giới chung: sàn rộng AW, mặt đất GY. Host xuất phát bên trái, guest bên phải;
   máy guest được LẬT NGANG khi vẽ để ai cũng thấy mình bên trái.
   Mạng: mỗi máy tự mô phỏng võ sĩ của mình và phát trạng thái ~18 lần/giây (fast).
   Người ĐÁNH quyết định trúng/trượt dựa trên vị trí đối thủ đang thấy → gửi 'hit' (chắc chắn).
   Người BỊ ĐÁNH tự trừ máu, báo lại 'hp'. Host làm trọng tài: đồng hồ, kết thúc hiệp, tỉ số.
   ========================================================================== */
const CS = 1.28; // tỉ lệ vẽ nhân vật
const VH = 540, GY = 470, AW = 1500, MAXSEP = 700, GRAV = 2300, ROUND_T = 99, WINS = 2;
const TAU = Math.PI * 2, PI = Math.PI;
const FONT = '"Baloo 2","Be Vietnam Pro",system-ui,sans-serif';
const OUT = '#1a1322';
const C_HOST = '#ff3b5c', C_GUEST = '#2f8bff';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const now = () => performance.now();
const rnd = (a, b) => a + Math.random() * (b - a);
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function kf(t, K) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t <= K[i][0]) {
    const a = K[i - 1], b = K[i]; let u = (t - a[0]) / Math.max(1e-6, b[0] - a[0]); u = u * u * (3 - 2 * u);
    return a[1] + (b[1] - a[1]) * u;
  }
  return K[K.length - 1][1];
}
const shadeC = {};
function shade(hex, k) {
  const key = hex + k; if (shadeC[key]) return shadeC[key];
  const n = parseInt(hex.slice(1), 16); let r = n >> 16 & 255, gg = n >> 8 & 255, b = n & 255;
  if (k < 0) { r *= 1 + k; gg *= 1 + k; b *= 1 + k; } else { r += (255 - r) * k; gg += (255 - gg) * k; b += (255 - b) * k; }
  return (shadeC[key] = 'rgb(' + (r | 0) + ',' + (gg | 0) + ',' + (b | 0) + ')');
}
function rng(seed) { let s = (seed * 9301 + 49297) % 233280 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

/* vật thể bay / vùng sát thương (cả hai máy cùng mô phỏng, chủ nhân quyết định trúng) */

};
const FREE = { idle: 1, run: 1, air: 1, air2: 1, guard: 1 };

const hold = { left: 0, right: 0, down: 0, up: 0 }, press = {};

  if (G.phase === 'select') {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') { choose(((G.mySel < 0 ? 0 : G.mySel) + 3) % 4); e.preventDefault(); }
    else if (e.code === 'KeyD' || e.code === 'ArrowRight') { choose(((G.mySel < 0 ? -1 : G.mySel) + 1) % 4); e.preventDefault(); }

    g.fillStyle = gl; g.beginPath(); g.arc(0, 0, 80 * r2, 0, TAU); g.fill(); g.restore();

function draw(rdt) {

/* ============================== VÒNG LẶP ============================== */
let last = now(), selDrawT = 0;
function frame(ts) {
  const rdt = Math.min(1 / 30, Math.max(0, (ts - last) / 1000)); last = ts;
  G.T += rdt;
  const dt = rdt * (now() < G.slowUntil ? .3 : 1);
  const act = G.phase === 'intro' || G.phase === 'fight' || G.phase === 'end';
  if (act) {
    if (G.hs > 0) G.hs -= rdt;
    else { updMe(dt); updProj(dt); }
    updRemote(rdt); updFx(dt); ambient(rdt);
    if (now() - G.lastSend > 55) {
      G.lastSend = now();
      Shell.send({ t: 's', x: Math.round(M.x), y: Math.round(M.y), vx: Math.round(M.vx), vy: Math.round(M.vy), f: M.f, a: M.st, at: +M.t.toFixed(2), hp: M.hp, en: Math.round(M.en) }, true);
    }
    hostChecks();
    const ub = document.querySelector('.fg-acts [data-k="ult"]'); if (ub) ub.classList.toggle('dim', M.en < 100);
  } else if (G.phase === 'select') {
    updSelect();
    if (ts - selDrawT > 33) { selDrawT = ts; drawPreviews(); }
  }
  if (!arena.classList.contains('hidden') && (act || G.phase === 'idle')) {
    try { draw(rdt); } catch (e) { console.error(e); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================== SHELL ============================== */
function beginAsHost() { resetMatch(); Shell.send({ t: 'sel', dl: 15000 }); later(() => openSelect(15000), Shell.lat()); }
Shell.init({
  id: 'fighter',
  colors: [C_HOST, C_GUEST],
  sides: ['', ''],
  howto: [
    'Ghép trận xong, hai bên <b>chọn nhân vật</b> trong 15 giây rồi bấm <b>Sẵn sàng</b> — bạn thấy được lựa chọn của đối thủ.',
    'Di chuyển <b>A/D</b> (hoặc mũi tên), nhảy <b>W</b> (nhảy đôi được), giữ <b>S</b> để đỡ đòn, <b>K</b> để lướt né.',
    'Bấm <b>J</b> liên tục ra combo 3 đòn. Đánh trúng hay bị đánh đều tích <b>nội lực</b> (4 vạch).',
    '<b>L</b> chiêu đánh xa, <b>U</b> chiêu lao tới — mỗi chiêu tốn 1 vạch. Đầy 4 vạch bấm <b>I</b> tung <b>tuyệt chiêu</b>!',
    'Mỗi hiệp 99 giây: hạ gục đối thủ, hoặc còn nhiều máu hơn khi hết giờ. Thắng <b>2/3 hiệp</b> là thắng trận.'
  ],
  keys: [[['A', 'D'], 'di chuyển'], [['W'], 'nhảy'], [['S'], 'đỡ'], [['J'], 'đánh'], [['K'], 'lướt'], [['L'], 'chiêu xa'], [['U'], 'chiêu lao'], [['I'], 'tuyệt chiêu']],
  onStart() { resetMatch(); if (isHost()) beginAsHost(); },
  onRematch() { resetMatch(); if (isHost()) beginAsHost(); },
  onStop() { clearTimers(); G.phase = 'idle'; G.projs = []; G.cut = null; showSelect(false); for (const k in hold) hold[k] = 0; },
  onOppName() { if (G.phase === 'select') renderSel(); syncHud(); },
  onMessage(m) {
    switch (m.t) {
      case 'sel': { const os = G.oppSel, orr = G.oppReady; resetMatch(); G.oppSel = os; G.oppReady = orr; openSelect(Math.max(3000, m.dl - Shell.lat())); break; }
      case 'cp':
        if (G.phase !== 'select' && G.phase !== 'wait') break;
        G.oppSel = m.c | 0; if (m.r) G.oppReady = true; renderSel(); if (m.r) Shell.sfx.pick();
        break;
      case 'rd': if (!isHost()) { G.oppSel = m.ch[0]; setupRound(m); } break;
      case 's': if (G.phase === 'intro' || G.phase === 'fight' || G.phase === 'end') onState(m); break;
      case 'hit': onHit(m); break;
      case 'hp':
        R.hp = m.hp; R.pend = R.pend.filter(p => p.id !== m.id);
        if (m.hp <= 0 && G.phase === 'fight') { startKO(); scheduleEnd('ko'); }
        break;
      case 'ko': if (isHost()) { R.hp = 0; startKO(); scheduleEnd('ko'); } break;
      case 'pj':
        if (G.phase === 'intro' || G.phase === 'fight' || G.phase === 'end') for (const a of m.L) { const o = mk(a[1], a[2], a[3], a[4], a[5], a[6], a[7], false, a[0]); stepProj(o, Shell.lat() / 1000); }
        break;
      case 'pk': { const o = G.projs.find(p => p.id === m.id); if (o) { o.dead = true; projPop(o); } break; }
      case 'ult':
        G.cut = { c: R.ch, pal: R.pal, t0: now(), side: 1, name: CH[R.ch].mvs.ult.name }; Shell.sfx.score(); G.flash = Math.max(G.flash, .25);
        if (G.phase === 'fight' && M.st !== 'ult') M.freeze = .45;
        break;
      case 're': if (!isHost()) onRoundEnd(m); break;
    }
  }
});
syncHud();
})();
</script>
