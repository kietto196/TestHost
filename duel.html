<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đấu Súng Tay Đôi — 2 người online</title>
<link rel="stylesheet" href="shared/shell.css">
<style>
#stage{width:100%; display:flex; flex-direction:column; align-items:center; gap:12px}
.du-wrap{position:relative; flex:none; width:640px; height:400px; border-radius:16px; overflow:hidden; background:#2a2f38;
  box-shadow:0 22px 50px -22px rgba(0,179,164,.6), 0 0 0 1px rgba(0,0,0,.08); touch-action:none; user-select:none; -webkit-user-select:none}
.du-wrap.mouse{cursor:none}
.du-wrap canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
/* cần điều khiển cảm ứng */
.du-pad{align-items:center}
.du-stick{position:relative; width:124px; height:124px; flex:none; border-radius:50%; touch-action:none;
  background:radial-gradient(circle, var(--surface-2) 0 38%, var(--surface) 39%); border:1.5px solid var(--line-2); box-shadow:var(--shadow)}
.du-stick::before{content:""; position:absolute; inset:14px; border-radius:50%; border:1.5px dashed var(--line-2)}
.du-stick .knob{position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 38% 32%, color-mix(in srgb, var(--kc, var(--accent)) 55%, #fff), var(--kc, var(--accent)) 70%);
  box-shadow:0 8px 16px -8px var(--kc, var(--accent)), inset 0 -3px 0 rgba(0,0,0,.18)}
.du-stick .lbl{position:absolute; left:0; right:0; bottom:-19px; text-align:center; font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap; pointer-events:none}
.du-stick.r .knob{background:conic-gradient(var(--kc, var(--accent)) calc(var(--p, 1) * 360deg), color-mix(in srgb, var(--kc, var(--accent)) 25%, var(--surface-2)) 0)}
.du-stick.r .knob::after{content:""; position:absolute; inset:7px; border-radius:50%; background:radial-gradient(circle at 38% 32%, #fff, color-mix(in srgb, var(--kc, var(--accent)) 30%, #fff))}
.du-stick.r.ready .knob{box-shadow:0 0 0 4px color-mix(in srgb, var(--kc, var(--accent)) 35%, transparent), 0 8px 16px -8px var(--kc)}
.du-dash{width:74px !important; height:74px !important; border-radius:50% !important; position:relative; overflow:hidden; font:800 14px var(--display) !important; flex-direction:column; display:flex !important; gap:0;
  background:conic-gradient(color-mix(in srgb, var(--accent) 85%, #fff) calc(var(--p, 1) * 360deg), var(--surface-2) 0) !important; color:#fff !important; border:0 !important}
.du-dash::before{content:""; position:absolute; inset:5px; border-radius:50%; background:var(--accent); z-index:0}
.du-dash.cd::before{background:var(--surface); }
.du-dash.cd{color:var(--muted) !important}
.du-dash > *{position:relative; z-index:1}
.du-dash svg{width:24px; height:24px}
.du-dash.on{transform:scale(.94)}
.du-mid{display:flex; flex-direction:column; align-items:center; gap:6px}
@media (hover:none) and (pointer:coarse){ .sh-bar .sh-keys{display:none} .touchpad.du-pad{padding-bottom:16px} }
</style>
</head>
<body>
<div id="stage">
  <div class="du-wrap" id="wrap"><canvas id="cv"></canvas></div>
  <div class="touchpad du-pad" id="tpad">
    <div class="du-stick" id="stL"><div class="knob"></div><span class="lbl">Di chuyển</span></div>
    <div class="du-mid"><button class="tbtn du-dash" id="dashBtn" aria-label="Lướt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Lướt</span></button></div>
    <div class="du-stick r" id="stR"><div class="knob"></div><span class="lbl">Ngắm · thả để bắn</span></div>
  </div>
</div>

<script src="shared/games.js"></script>
<script src="shared/net.js"></script>
<script src="shared/shell.js"></script>
<script>
(() => {
'use strict';
/* ĐẤU SÚNG TAY ĐÔI — bắn nhau 1 đấu 1 nhìn từ trên xuống.
   Mạng: mỗi người tự di chuyển nhân vật của mình (tức thì) và gửi vị trí + góc ngắm ~16 lần/giây (fast).
   Phát bắn: tin 'f' chắc chắn (vị trí nòng, góc). Hai máy cùng mô phỏng viên đạn theo cùng luật; máy nhận tua nhanh đạn
   theo độ trễ ước tính. Trúng hay không do máy của NGƯỜI BỊ BẮN tự xét theo vị trí thật của mình → gửi 'hit'.
   Mỗi máy giữ máu của mình. Chủ phòng (host) phân xử hết ván (hoà nếu cả hai gục trong khoảng ngắn), hết giờ, hộp máu. */
const W = 960, H = 600, B = 18, PR = 16, BR = 5;
const SPEED = 230, BSPEED = 840, RELOAD = 2000, DASH_CD = 3000, DASH_T = 150, DASH_V = 1000;
const HP = 3, WIN = 3, ROUND_T = 60000, HEAL_FIRST = 12000, HEAL_NEXT = 15000;
const C_HOST = '#00c2b2', C_GUEST = '#ff8a3d';
const SPAWN = [[86, 300], [874, 300]];

const cv = document.getElementById('cv'), cx = cv.getContext('2d'), wrap = document.getElementById('wrap');
const stage = document.getElementById('stage');

/* ---------- tiện ích ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill(); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
function heartPath(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y + s * .9);
  c.bezierCurveTo(x - s * 1.3, y + s * .1, x - s * 1.05, y - s * 1.05, x, y - s * .35);
  c.bezierCurveTo(x + s * 1.05, y - s * 1.05, x + s * 1.3, y + s * .1, x, y + s * .9); c.closePath();
}
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };

/* ---------- bản đồ (đối xứng tâm → công bằng cho 2 bên) ---------- */
function mk(name, theme, half, center, heals) {
  const obs = center.slice();
  half.forEach(o => { obs.push(o); obs.push({ k: o.k, x: W - o.x - o.w, y: H - o.y - o.h, w: o.w, h: o.h }); });
  return { name, theme, obs, heals };
}
const MAPS = [
  mk('Nhà kho', 0, [
    { k: 'crate', x: 200, y: 96, w: 104, h: 52 }, { k: 'crate', x: 200, y: 148, w: 52, h: 52 },
    { k: 'wall', x: 196, y: 392, w: 26, h: 132 }, { k: 'low', x: 330, y: 262, w: 22, h: 76 },
    { k: 'crate', x: 392, y: 460, w: 52, h: 52 }, { k: 'crate', x: 118, y: 214, w: 44, h: 44 }
  ], [{ k: 'crate', x: 450, y: 270, w: 60, h: 60 }], [[480, 112], [480, 488]]),
  mk('Khu vườn', 1, [
    { k: 'wall', x: 170, y: 84, w: 150, h: 24 }, { k: 'wall', x: 170, y: 108, w: 24, h: 96 },
    { k: 'low', x: 150, y: 404, w: 24, h: 120 }, { k: 'crate', x: 322, y: 322, w: 52, h: 52 },
    { k: 'low', x: 300, y: 160, w: 100, h: 22 }
  ], [{ k: 'wall', x: 468, y: 214, w: 24, h: 172 }], [[480, 96], [480, 504]]),
  mk('Trạm vũ trụ', 2, [
    { k: 'wall', x: 240, y: 150, w: 44, h: 44 }, { k: 'wall', x: 240, y: 406, w: 44, h: 44 },
    { k: 'low', x: 372, y: 70, w: 22, h: 130 }, { k: 'crate', x: 160, y: 278, w: 44, h: 44 },
    { k: 'wall', x: 372, y: 486, w: 110, h: 22 }
  ], [{ k: 'low', x: 410, y: 289, w: 140, h: 22 }], [[480, 210], [480, 390]])
];

/* ---------- trạng thái ---------- */
function newP(i) {
  return { x: SPAWN[i][0], y: SPAWN[i][1], tx: SPAWN[i][0], ty: SPAWN[i][1], a: i ? Math.PI : 0, ta: i ? Math.PI : 0, hp: HP, dead: false, deadT: 0,
    lastFire: -1e9, lastRecv: -1e9, ready: true, readyFlash: 0, dashAt: -1e9, dashUntil: 0, dx: 1, dy: 0, flash: 0, muzzle: 0,
    moving: false, ph: 0, ghosts: [], dashing: false, dashReadyNote: true };
}
const G = {
  phase: 'idle', n: 0, rn: 0, map: 0, score: [0, 0], P: [newP(0), newP(1)], bullets: [], parts: [], floats: [], decals: [],
  heal: null, healIdx: 0, nextHeal: 0, fightStart: 0, shake: 0, timers: [], dead: new Set(), judgeT: null, bid: 1,
  lastSend: 0, sent: '', hudKey: '', clockS: -1, hits: [0, 0], shots: [0, 0]
};
const meI = () => Shell.isHost ? 0 : 1;
const ME = () => G.P[meI()], OPP = () => G.P[1 - meI()];
const COL = i => i === 0 ? C_HOST : C_GUEST;
const later = (fn, ms) => { const t = setTimeout(fn, ms); G.timers.push(t); return t; };
function clearTimers() { G.timers.forEach(clearTimeout); G.timers = []; G.judgeT = null; }
const OBS = () => MAPS[G.map].obs;

/* ---------- va chạm ---------- */
function blockedBullet(x, y) {
  if (x < B || x > W - B || y < B || y > H - B) return true;
  for (const o of OBS()) if (o.k !== 'low' && x >= o.x - 1 && x <= o.x + o.w + 1 && y >= o.y - 1 && y <= o.y + o.h + 1) return true;
  return false;
}
function resolve(p) {
  for (let it = 0; it < 2; it++) {
    for (const o of OBS()) {
      const qx = Math.max(o.x, Math.min(o.x + o.w, p.x)), qy = Math.max(o.y, Math.min(o.y + o.h, p.y));
      let dx = p.x - qx, dy = p.y - qy; const d2 = dx * dx + dy * dy;
      if (d2 >= PR * PR) continue;
      if (d2 > 1e-6) { const d = Math.sqrt(d2); p.x = qx + dx / d * PR; p.y = qy + dy / d * PR; }
      else {
        const l = p.x - o.x, r = o.x + o.w - p.x, t = p.y - o.y, b = o.y + o.h - p.y, m = Math.min(l, r, t, b);
        if (m === l) p.x = o.x - PR; else if (m === r) p.x = o.x + o.w + PR; else if (m === t) p.y = o.y - PR; else p.y = o.y + o.h + PR;
      }
    }
    p.x = Math.max(B + PR, Math.min(W - B - PR, p.x)); p.y = Math.max(B + PR, Math.min(H - B - PR, p.y));
  }
}
function moveCircle(p, dx, dy) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6));
  for (let i = 0; i < n; i++) { p.x += dx / n; p.y += dy / n; resolve(p); }
}
function ray(x, y, a, max = 1200) {
  const c = Math.cos(a), s = Math.sin(a); let d = 0;
  while (d < max) { d += 5; if (blockedBullet(x + c * d, y + s * d)) { d -= 5; for (let j = 0; j < 5; j++) { d += 1; if (blockedBullet(x + c * d, y + s * d)) break; } break; } }
  return [x + c * d, y + s * d, d];
}

/* ---------- khung nhìn: mỗi người luôn thấy mình bên trái (máy ngang) hoặc phía dưới (máy dọc) ---------- */
const V = { th: 0, c: 1, s: 0, k: 1, cx: 0, cy: 0, cw: 0, ch: 0, port: false, sx: 0, sy: 0, dpr: 1 };
function calcView() {
  V.th = (Shell.isHost ? 0 : Math.PI) + (V.port ? -Math.PI / 2 : 0);
  V.c = Math.round(Math.cos(V.th)); V.s = Math.round(Math.sin(V.th));
  V.k = V.cw / (V.port ? H : W); V.cx = V.cw / 2; V.cy = V.ch / 2;
}
const toS = (x, y) => { const dx = (x - W / 2) * V.k, dy = (y - H / 2) * V.k; return [V.cx + dx * V.c - dy * V.s + V.sx, V.cy + dx * V.s + dy * V.c + V.sy]; };
const toW = (sx, sy) => { const dx = (sx - V.cx) / V.k, dy = (sy - V.cy) / V.k; return [W / 2 + dx * V.c + dy * V.s, H / 2 - dx * V.s + dy * V.c]; };
const vecW = (x, y) => [x * V.c + y * V.s, -x * V.s + y * V.c];
function worldT(c) {
  const k = V.k, d = V.dpr;
  c.setTransform(d * V.c * k, d * V.s * k, -d * V.s * k, d * V.c * k,
    d * (V.cx - k * (V.c * W / 2 - V.s * H / 2) + V.sx), d * (V.cy - k * (V.s * W / 2 + V.c * H / 2) + V.sy));
}
function sRect(o) { const [ax, ay] = toS(o.x, o.y), [bx, by] = toS(o.x + o.w, o.y + o.h); return { x: Math.min(ax, bx), y: Math.min(ay, by), w: Math.abs(bx - ax), h: Math.abs(by - ay) }; }

function layout() {
  const port = innerWidth < innerHeight && innerWidth < 760;
  const touch = matchMedia('(hover:none) and (pointer:coarse)').matches;
  const top = stage.getBoundingClientRect().top;
  const pad = document.getElementById('tpad');
  const reserve = 58 + (touch ? (pad.offsetHeight || 150) + 12 : 0);
  const availW = Math.min(stage.clientWidth || innerWidth - 32, 1000);
  const availH = Math.max(220, innerHeight - Math.max(0, top) - reserve);
  const asp = port ? H / W : W / H;
  let w = Math.max(240, Math.min(availW, availH * asp)); w = Math.floor(w); const h = Math.floor(w / asp);
  if (wrap.offsetWidth !== w || wrap.offsetHeight !== h) { wrap.style.width = w + 'px'; wrap.style.height = h + 'px'; }
  V.port = port; wrap.classList.toggle('port', port);
}
function resize() {
  V.dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = wrap.getBoundingClientRect(); if (!r.width) return;
  V.cw = r.width; V.ch = r.height;
  const pw = Math.round(r.width * V.dpr), ph = Math.round(r.height * V.dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
}
new ResizeObserver(() => { resize(); }).observe(wrap);
addEventListener('resize', () => { layout(); resize(); });

/* ---------- nền + vật cản (vẽ sẵn) ---------- */
let bg = null, bgKey = '';
const THEMES = [
  { // nhà kho
    light: { base: '#d8d2c4', alt: '#d0c9b9', grout: 'rgba(80,60,30,.10)', mark: '#e0b43a', wallTop: '#a7aeb8', wallFront: '#79808b', crate: '#cf8f4c', crateD: '#9c612c', low: '#f2c230' },
    dark: { base: '#2a2e37', alt: '#272b33', grout: 'rgba(255,255,255,.045)', mark: '#8a7128', wallTop: '#596272', wallFront: '#363c48', crate: '#93603a', crateD: '#64401f', low: '#c49a1e' }
  },
  { // vườn
    light: { base: '#93d26c', alt: '#89c963', grout: 'rgba(30,80,10,.0)', mark: '#d9eec0', wallTop: '#c7bba0', wallFront: '#958a70', crate: '#cf8f4c', crateD: '#9c612c', low: '#b07a45' },
    dark: { base: '#2b5640', alt: '#28503b', grout: 'rgba(0,0,0,0)', mark: '#3f7458', wallTop: '#6b6656', wallFront: '#454236', crate: '#8f5e37', crateD: '#5f3d1e', low: '#7f5732' }
  },
  { // trạm vũ trụ
    light: { base: '#cdd6e1', alt: '#c4cedb', grout: 'rgba(30,50,90,.14)', mark: '#25c7f0', wallTop: '#8e9cb2', wallFront: '#5f6b80', crate: '#9aa6b9', crateD: '#6b778a', low: '#25c7f0' },
    dark: { base: '#161c28', alt: '#192030', grout: 'rgba(120,170,255,.08)', mark: '#1fb6e0', wallTop: '#36425a', wallFront: '#212838', crate: '#46536b', crateD: '#2b3446', low: '#38e1ff' }
  }
];
const pal = () => THEMES[MAPS[G.map].theme][isDark() ? 'dark' : 'light'];

function buildBg() {
  const key = [G.map, V.th, V.cw, V.ch, V.dpr, isDark()].join('|');
  if (key === bgKey && bg) return; bgKey = key;
  bg = bg || document.createElement('canvas');
  bg.width = cv.width; bg.height = cv.height;
  const c = bg.getContext('2d'), P = pal(), th = MAPS[G.map].theme, dk = isDark();
  const sx = V.sx, sy = V.sy; V.sx = V.sy = 0;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = P.base; c.fillRect(0, 0, bg.width, bg.height);
  worldT(c);
  const rnd = mulberry32(77 + G.map * 131);
  if (th === 0) {
    const T = 60;
    for (let y = 0; y < H; y += T) for (let x = 0; x < W; x += T) { if (((x + y) / T) % 2) { c.fillStyle = P.alt; c.fillRect(x, y, T, T); } }
    c.strokeStyle = P.grout; c.lineWidth = 2;
    for (let x = 0; x <= W; x += T) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
    for (let y = 0; y <= H; y += T) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    for (let i = 0; i < 9; i++) { c.fillStyle = dk ? 'rgba(0,0,0,.18)' : 'rgba(70,50,20,.07)'; ell(c, 60 + rnd() * (W - 120), 60 + rnd() * (H - 120), 14 + rnd() * 26, 8 + rnd() * 14); }
    c.strokeStyle = P.mark; c.lineWidth = 5; c.setLineDash([22, 14]);
    c.beginPath(); c.moveTo(W / 2, B); c.lineTo(W / 2, H - B); c.stroke(); c.setLineDash([]);
    c.globalAlpha = .7; c.beginPath(); c.arc(W / 2, H / 2, 96, 0, Math.PI * 2); c.stroke(); c.globalAlpha = 1;
  } else if (th === 1) {
    const T = 48;
    for (let y = 0; y < H; y += T) for (let x = 0; x < W; x += T) { if (((x + y) / T) % 2) { c.fillStyle = P.alt; c.fillRect(x, y, T, T); } }
    c.fillStyle = dk ? 'rgba(80,60,30,.35)' : 'rgba(190,150,90,.45)';
    for (let i = 0; i < 26; i++) { const t = i / 25; ell(c, 120 + t * (W - 240) + Math.sin(t * 9) * 8, H / 2 + Math.sin(t * 6.3) * 36, 22, 13); }
    c.strokeStyle = dk ? 'rgba(10,40,25,.55)' : 'rgba(40,110,30,.55)'; c.lineWidth = 2; c.lineCap = 'round';
    for (let i = 0; i < 120; i++) { const x = rnd() * W, y = rnd() * H; c.beginPath(); c.moveTo(x - 4, y - 5); c.lineTo(x, y + 2); c.lineTo(x + 4, y - 6); c.stroke(); }
    for (let i = 0; i < 40; i++) {
      const x = rnd() * W, y = rnd() * H, col = dk ? (rnd() < .5 ? 'rgba(210,255,140,.55)' : 'rgba(255,255,255,.18)') : ['#fff', '#ffe066', '#ff9fc4'][i % 3];
      c.fillStyle = col; circ(c, x, y, dk ? 2 : 3); if (!dk) { c.fillStyle = '#ffc93c'; circ(c, x, y, 1.1); }
    }
  } else {
    const T = 80;
    for (let y = 0; y < H; y += T) for (let x = 0; x < W; x += T) {
      c.fillStyle = ((x + y) / T) % 2 ? P.alt : P.base; c.fillRect(x, y, T, T);
      c.fillStyle = dk ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.35)'; c.fillRect(x + 2, y + 2, T - 4, 2);
      c.fillStyle = dk ? 'rgba(0,0,0,.25)' : 'rgba(40,60,90,.12)'; c.fillRect(x + 2, y + T - 4, T - 4, 2);
      c.fillStyle = dk ? 'rgba(160,190,255,.16)' : 'rgba(40,60,90,.25)';
      [[8, 8], [T - 8, 8], [8, T - 8], [T - 8, T - 8]].forEach(([a, b]) => circ(c, x + a, y + b, 2));
    }
    c.strokeStyle = P.grout; c.lineWidth = 2;

    for (let y = 0; y <= H; y += T) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }

        cx.fillStyle = 'rgba(0,0,0,.35)'; rr(cx, sx - bw / 2, by - 2.5 * ui, bw, 5 * ui, 2.5 * ui); cx.fill();
        cx.fillStyle = '#7fe7ff'; rr(cx, sx - bw / 2, by - 2.5 * ui, bw * dp, 5 * ui, 2.5 * ui); cx.fill(); }
    }
  });
  // hạt
  worldT(cx);
  G.parts.forEach(p => {
    const u = p.t / p.life;
    if (p.k === 'puff') { cx.globalAlpha = (1 - u) * .85; cx.fillStyle = p.col; circ(cx, p.x, p.y, p.r * (1 + u * 1.2)); }
    else if (p.k === 'ring') { cx.globalAlpha = 1 - u; cx.strokeStyle = p.col; cx.lineWidth = 3 * (1 - u) + .5; cx.beginPath(); cx.arc(p.x, p.y, p.r + u * 34, 0, Math.PI * 2); cx.stroke(); }
    else { cx.globalAlpha = 1 - u; cx.fillStyle = p.col; circ(cx, p.x, p.y, p.r * (1 - u * .5)); }
  });
  cx.globalAlpha = 1;
  // chữ bay
  cx.setTransform(d, 0, 0, d, 0, 0);
  G.floats.forEach(f => {
    const [sx, sy] = toS(f.x, f.y), u = f.t / 1.1, fs = Math.max(14, 20 * k * ui);
    cx.globalAlpha = 1 - u * u; const yy = sy - u * 40 * k * ui;
    cx.font = `800 ${fs}px "Baloo 2", system-ui, sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.lineWidth = 4; cx.strokeStyle = 'rgba(0,0,0,.45)'; cx.strokeText(f.text, sx - fs * .45, yy); cx.fillStyle = f.col; cx.fillText(f.text, sx - fs * .45, yy);
    cx.fillStyle = f.col; heartPath(cx, sx + fs * .55, yy, fs * .38); cx.fill();
    cx.globalAlpha = 1;
  });
  // tâm ngắm chuột
  if (inp.mode === 'mouse' && inp.mx != null && Shell.playing() && G.phase !== 'idle') {
    wrap.classList.add('mouse');
    const pr = Math.min(1, (now - me.lastFire) / RELOAD), col = COL(mi), x = inp.mx, y = inp.my;
    cx.lineCap = 'round';
    cx.strokeStyle = 'rgba(0,0,0,.45)'; cx.lineWidth = 4;
    const cross = () => { cx.beginPath(); [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([a, b]) => { cx.moveTo(x + a * 5, y + b * 5); cx.lineTo(x + a * 11, y + b * 11); }); cx.stroke(); };
    cross(); cx.strokeStyle = '#fff'; cx.lineWidth = 2; cross();
    drawRing(cx, x, y, 15, pr, col, pr >= 1, me.readyFlash, 2.5, me.dry);
    cx.fillStyle = pr >= 1 ? col : '#ffd34d'; circ(cx, x, y, 2);
  } else wrap.classList.remove('mouse');
  if (G.phase === 'idle' && !Shell.playing()) { /* màn chờ */ }
}

let last = performance.now(), layT = 0;
function loop() {
  const now = performance.now(), dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now;
  if ((layT += dt) > .5) { layT = 0; layout(); }
  try { update(dt, now); if (V.cw) draw(now); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

/* ---------- mạng ---------- */
function onMsg(m) {
  if (m.t === 'round') { if (!Shell.isHost) { G.score = m.s.slice(); Shell.setScore(m.s[1], m.s[0]); beginRound(m.n, m.rn, m.m); } return; }
  if (m.n !== G.n) return;
  const opp = OPP(), oi = 1 - meI(), now = performance.now();
  switch (m.t) {
    case 'p':
      if (opp.dead) return;
      opp.tx = m.x; opp.ty = m.y; opp.ta = m.a; opp.dashing = !!m.d;
      if (G.phase === 'count') { opp.x = m.x; opp.y = m.y; }
      break;
    case 'f': {
      if (opp.dead || !(G.phase === 'fight' || G.phase === 'end')) return;
      if (now - opp.lastRecv < RELOAD - 450) return;   // chống bắn nhanh hơn luật
      opp.lastRecv = now; opp.lastFire = now - Shell.lat(); opp.muzzle = 1;
      opp.tx = m.px; opp.ty = m.py; opp.ta = m.a; opp.a = m.a;
      const b = spawnBullet(oi, m.id, m.x, m.y, m.a);
      G.shots[oi]++;
      const adv = Math.min(150, Shell.lat()) / 1000;
      for (let s = 0; s < adv && !b.dead; s += 1 / 120) stepBullet(b, Math.min(1 / 120, adv - s), true);
      if (blockedBullet(m.x, m.y)) b.dead = true;
      Shell.sfx.hit2();
      break;
    }
    case 'hit': {
      const b = G.bullets.find(x => x.o === meI() && x.id === m.id);
      if (b) b.dead = true;
      opp.x = opp.tx = m.x; opp.y = opp.ty = m.y;
      const was = opp.hp; opp.hp = m.hp; opp.flash = 1; G.hits[meI()]++;
      if (m.hp < was) floatTxt(opp.x, opp.y - 30, '−1', '#ff4b5c');
      burst(opp.x, opp.y, COL(oi), 14, 260, .45, 3); burst(opp.x, opp.y, '#fff', 6, 200, .3, 2);
      G.shake = Math.max(G.shake, 6); Shell.sfx.hit();
      if (m.hp <= 0) die(opp, oi);
      hudTick(true);
      break;
    }
    case 'heal': if (!Shell.isHost && G.phase === 'fight') G.heal = { id: m.id, x: m.x, y: m.y, t0: now }; break;
    case 'pk':
      if (!Shell.isHost) return;
      if (G.heal && G.heal.id === m.id && G.phase === 'fight') { pickHeal(1); G.nextHeal = now + HEAL_NEXT; Shell.send({ t: 'got', n: G.n, id: m.id, w: 1 }); }
      else Shell.send({ t: 'got', n: G.n, id: m.id, w: -1 });
      break;
    case 'got':
      if (Shell.isHost) return;
      if (m.w === 1) pickHeal(1);
      else if (m.w === 0) pickHeal(0);
      else if (G.heal && G.heal.id === m.id) G.heal = null;
      break;
    case 'rend': if (!Shell.isHost) applyRend(m.w, m.s, m.why); break;
  }
}

Shell.init({
  id: 'duel',
  colors: [C_HOST, C_GUEST],
  sides: ['Ngọc', 'Cam'],
  howto: [
    'Di chuyển, ngắm và bắn đối thủ. Đạn bay thật (né được!) và bị <b>tường, thùng gỗ</b> chặn lại; <b>rào thấp</b> chỉ cản đường đi, đạn bay qua được.',
    'Mỗi phát bắn xong súng phải <b>nạp 2 giây</b> — vòng quanh nhân vật và tâm ngắm sẽ đầy dần, nghe "tách" là bắn được.',
    '<b>Lướt</b> để né đạn: trong lúc lướt bạn không bị trúng, hồi lại sau 3 giây.',
    'Mỗi ván có <b>3 tim</b>, trúng 1 phát mất 1 tim. Giữa ván có <b>hộp máu</b> hồi 1 tim. Hết 60 giây, ai nhiều tim hơn thắng ván.',
    'Thắng <b>3 ván</b> trước là thắng trận. Mỗi ván đổi một đấu trường.'
  ],
  keys: [[['W', 'A', 'S', 'D'], 'di chuyển'], ['Chuột', 'ngắm'], ['Click', 'bắn'], [['Shift', 'Space'], 'lướt'], ['Cảm ứng', 'cần trái đi · cần phải ngắm, thả để bắn']],
  onStart() { resetMatch(); layout(); resize(); document.getElementById('tpad').style.setProperty('--kc', Shell.myColor); if (Shell.isHost) hostNewRound(); },
  onRematch() { resetMatch(); if (Shell.isHost) hostNewRound(); },
  onStop() { clearTimers(); G.phase = 'idle'; keys.clear(); inp.tmx = inp.tmy = 0; inp.aimOn = false; },
  onTheme() { bgKey = ''; },
  onMessage: onMsg
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { bgKey = ''; });
window.__duel = { G, V, toS, toW, MAPS, tryFire, tryDash, ME, OPP };
layout(); resize();
requestAnimationFrame(loop);
})();
</script>
