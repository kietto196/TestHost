<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đặt Bom — 2 người online</title>
<link rel="stylesheet" href="shared/shell.css">
<style>
#stage{width:100%; display:flex; flex-direction:column; align-items:center; gap:10px}
.bm-root{display:flex; gap:14px; justify-content:center; align-items:stretch; width:100%}
.bm-board{position:relative; flex:none; width:max(260px, min(calc(100vw - 32px - 214px), 760px, calc((100svh - 232px) * 15 / 13))); aspect-ratio:15/13;
  border-radius:16px; overflow:hidden; background:#7b8798; box-shadow:0 22px 50px -22px rgba(255,122,26,.6), 0 0 0 1px rgba(0,0,0,.08); touch-action:none}
.bm-board canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.bm-side{width:200px; flex:none; display:flex; flex-direction:column; gap:10px}
.bm-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:12px; display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden}
.bm-card::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--pc)}
.bm-head{display:flex; align-items:center; gap:10px; min-width:0}
.bm-face{width:58px; height:58px; flex:none; border-radius:14px; background:radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--pc) 22%, #fff7e8), color-mix(in srgb, var(--pc) 10%, #f1d29a)); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--pc) 55%, transparent)}
.bm-card.dead .bm-face{filter:grayscale(1) opacity(.6)}
.bm-nm{min-width:0; flex:1}
.bm-nm b{display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bm-nm small{font-size:12px; color:var(--muted); font-weight:600}
.bm-stars{display:flex; gap:3px; margin-top:3px}
.bm-stars i{width:16px; height:16px; display:block; background:var(--line-2); clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.bm-stars i.on{background:#ffb21f}
.bm-stats{display:flex; gap:6px}
.bm-stats span{flex:1; display:flex; align-items:center; justify-content:center; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:5px 4px; font:800 15px var(--display)}
.bm-stats svg{width:20px; height:20px; flex:none}
.bm-mid{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:12px; display:grid; grid-template-columns:1fr 1fr; text-align:center; gap:4px}
.bm-mid small{display:block; font-size:12px; color:var(--muted); font-weight:600}
.bm-mid b{font:800 24px/1.1 var(--display)}
.bm-mid b.sd{color:var(--bad)}
.bm-legend{font-size:12px; color:var(--muted); line-height:1.5; padding:0 4px}
.bm-legend div{display:flex; align-items:center; gap:8px}
.bm-legend svg{width:18px; height:18px; flex:none}
/* điều khiển cảm ứng */
.bm-dpad{position:relative; width:150px; height:150px; flex:none; touch-action:none}
.bm-dpad .tbtn{position:absolute; width:52px; height:52px; font-size:20px; pointer-events:none}
.bm-dpad .u{left:49px; top:0} .bm-dpad .d{left:49px; bottom:0} .bm-dpad .l{left:0; top:49px} .bm-dpad .r{right:0; top:49px}
.bm-dpad::after{content:""; position:absolute; left:58px; top:58px; width:34px; height:34px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line)}
.bm-bomb{width:96px !important; height:96px !important; border-radius:50% !important; align-self:center; background:radial-gradient(circle at 40% 35%, #ffb35c, #ff7a1a 60%, #d95500) !important; color:#fff !important; border:0 !important; box-shadow:0 12px 24px -10px #ff7a1a !important; font:800 15px var(--display) !important; display:flex !important; flex-direction:column; gap:0}
.bm-bomb svg{width:40px; height:40px}
.bm-bomb.on{filter:brightness(.88); transform:scale(.96)}
@media (max-width:820px){
  .bm-root{flex-direction:column; align-items:center; gap:8px}
  .bm-board{width:min(100%, max(260px, calc((100svh - 310px) * 15 / 13)))}
  .bm-side{width:100%; max-width:640px; flex-direction:row; gap:8px}
  .bm-card{flex:1; padding:8px; gap:6px; min-width:0}
  .bm-face{width:38px; height:38px; border-radius:10px}
  .bm-nm b{font-size:13px} .bm-nm small{display:none}
  .bm-stars i{width:12px; height:12px}
  .bm-stats{gap:3px} .bm-stats span{font-size:13px; padding:3px 2px; gap:2px} .bm-stats svg{width:15px; height:15px}
  .bm-mid{flex:none; width:72px; grid-template-columns:1fr; padding:6px 4px; align-content:center}
  .bm-mid b{font-size:18px}
  .bm-legend{display:none}
}
@media (hover:none) and (pointer:coarse){
  .bm-board{width:min(100%, 760px, max(240px, calc((100svh - 480px) * 15 / 13)))}
  .bm-legend{display:none}
  .sh-bar .sh-keys{display:none}
}
@media (hover:none) and (pointer:coarse) and (min-width:821px){
  .bm-board{width:max(240px, min(calc(100vw - 32px - 214px), 760px, calc((100svh - 410px) * 15 / 13)))}
}
</style>
</head>
<body>
<div id="stage">
  <div class="bm-root">
    <div class="bm-board" id="wrap"><canvas id="cv"></canvas></div>
    <aside class="bm-side">
      <div class="bm-card" id="pcMe"><div class="bm-head"><canvas class="bm-face"></canvas><div class="bm-nm"><b>Bạn</b><small>Bạn</small><div class="bm-stars"><i></i><i></i></div></div></div>
        <div class="bm-stats"><span data-k="bombs"></span><span data-k="fire"></span><span data-k="speed"></span></div></div>
      <div class="bm-mid"><div><small>Ván</small><b id="bmRound">1</b></div><div><small>Thời gian</small><b id="bmClock">2:00</b></div></div>
      <div class="bm-card" id="pcOpp"><div class="bm-head"><canvas class="bm-face"></canvas><div class="bm-nm"><b>Đối thủ</b><small>Đối thủ</small><div class="bm-stars"><i></i><i></i></div></div></div>
        <div class="bm-stats"><span data-k="bombs"></span><span data-k="fire"></span><span data-k="speed"></span></div></div>
      <div class="bm-legend" id="bmLegend"></div>
    </aside>
  </div>
  <div class="touchpad" id="tpad">
    <div class="bm-dpad" id="dpad"><div class="tbtn u">▲</div><div class="tbtn l">◀</div><div class="tbtn r">▶</div><div class="tbtn d">▼</div></div>
    <button class="tbtn bm-bomb" id="bombBtn" aria-label="Đặt bom"></button>
  </div>
</div>

<script src="shared/games.js"></script>
<script src="shared/net.js"></script>
<script src="shared/shell.js"></script>
<script>
(() => {
'use strict';
/* ĐẶT BOM — Bomberman 1 đấu 1.
   Mạng: mỗi người tự di chuyển nhân vật của mình (tức thì) và gửi vị trí ~15 lần/giây.
   Chủ phòng (host) quyết định bom, nổ, phá khối, vật phẩm và kết quả ván; khách gửi yêu cầu đặt bom / nhặt đồ.
   Mỗi máy tự phát hiện mình dính lửa (theo lửa nó thấy) rồi báo; host chờ một khoảng ngắn để xử hoà khi cùng chết. */
const T = 48, COLS = 15, ROWS = 13, W = COLS * T, H = ROWS * T;
const FUSE = 2500, FLAME = 520, ROUND_T = 120, SD_STEP = 230, SD_FALL = 320, WIN_ROUNDS = 2;
const C_HOST = '#3b82ff', C_GUEST = '#ff5ea8';
const SPAWN = [[1.5, 1.5], [13.5, 11.5]];
const DIRV = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
const EMPTY = 0, HARD = 1, SOFT = 2, STEEL = 3;

const cv = document.getElementById('cv'), cx = cv.getContext('2d'), wrap = document.getElementById('wrap');
let scale = 1, dpr = 1, bg = null, SP = {};

/* ---------- tiện ích ---------- */
const idx = (x, y) => y * COLS + x;
const cellOf = v => Math.floor(v);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill(); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }

/* ---------- trạng thái ---------- */
const G = {
  phase: 'idle', n: 0, rn: 0, score: [0, 0], grid: new Uint8Array(COLS * ROWS), style: new Uint8Array(COLS * ROWS),
  hidden: new Uint8Array(COLS * ROWS), pu: new Uint8Array(COLS * ROWS), puT: new Float64Array(COLS * ROWS),
  bombs: new Map(), bcell: new Map(), flames: [], fcell: new Map(), crumbles: [], parts: [], drops: [], sdIdx: 0, sdOn: false,
  P: [], nextId: 1, reqId: 1, pass: new Set(), roundStart: 0, shake: 0, timers: [], dead: new Set(), judgeT: null, lastSend: 0, lastSig: '', clockS: -1
};
const meI = () => Shell.isHost ? 0 : 1;
const ME = () => G.P[meI()], OPP = () => G.P[1 - meI()];
function newPlayer(i) {
  return { x: SPAWN[i][0], y: SPAWN[i][1], tx: SPAWN[i][0], ty: SPAWN[i][1], dir: i ? 'u' : 'd', moving: false, ph: 0, dead: false, deadT: 0, bombs: 1, fire: 2, speed: 0 };
}
G.P = [newPlayer(0), newPlayer(1)];
const later = (fn, ms) => { const t = setTimeout(fn, ms); G.timers.push(t); return t; };
function clearTimers() { G.timers.forEach(clearTimeout); G.timers = []; G.judgeT = null; }

/* thứ tự khối thép rơi khi đột tử: xoắn ốc từ ngoài vào */
const SPIRAL = (() => {
  const out = []; let x0 = 1, y0 = 1, x1 = COLS - 2, y1 = ROWS - 2;
  while (x0 <= x1 && y0 <= y1) {
    for (let x = x0; x <= x1; x++) out.push(idx(x, y0));
    for (let y = y0 + 1; y <= y1; y++) out.push(idx(x1, y));
    if (y0 < y1) for (let x = x1 - 1; x >= x0; x--) out.push(idx(x, y1));
    if (x0 < x1) for (let y = y1 - 1; y > y0; y--) out.push(idx(x0, y));
    x0++; y0++; x1--; y1--;
  }
  return out.filter(i => { const x = i % COLS, y = (i / COLS) | 0; return !(x % 2 === 0 && y % 2 === 0); });
})();

/* ---------- bản đồ (cùng seed → giống hệt nhau ở 2 máy, đối xứng tâm cho công bằng) ---------- */
function genMap(seed) {
  const rnd = mulberry32(seed), g = G.grid;
  g.fill(0); G.style.fill(0); G.hidden.fill(0); G.pu.fill(0);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1 || (x % 2 === 0 && y % 2 === 0)) g[idx(x, y)] = HARD;
  }
  const safe = new Set([idx(1, 1), idx(2, 1), idx(1, 2), idx(3, 1), idx(1, 3)].flatMap(i => [i, COLS * ROWS - 1 - i]));
  const half = [];
  for (let i = 0; i <= (COLS * ROWS - 1) / 2; i++) {
    if (g[i] !== EMPTY || safe.has(i)) continue;
    const j = COLS * ROWS - 1 - i;
    if (rnd() < 0.68) {
      const st = rnd() < 0.27 ? 1 : 0;
      g[i] = g[j] = SOFT; G.style[i] = G.style[j] = st;
      if (i !== j) half.push(i);
    }
  }
  // các ô (3,1),(1,3) cho bụi cây 50% để mở đầu không quá chật
  for (const i of [idx(3, 1), idx(1, 3)]) if (rnd() < 0.5) { const j = COLS * ROWS - 1 - i; g[i] = g[j] = SOFT; G.style[i] = G.style[j] = 1; }
  for (let k = half.length - 1; k > 0; k--) { const r = Math.floor(rnd() * (k + 1)); [half[k], half[r]] = [half[r], half[k]]; }
  [1, 1, 1, 2, 2, 2, 3, 3].forEach((kind, k) => { if (half[k] != null) { G.hidden[half[k]] = G.hidden[COLS * ROWS - 1 - half[k]] = kind; } });
}

/* ---------- vẽ: sprite dựng sẵn theo độ phân giải ---------- */
function mkSprite(fn, pad = 8) {
  const c = document.createElement('canvas'), s = scale;
  c.width = c.height = Math.ceil((T + pad * 2) * s);
  const x = c.getContext('2d'); x.scale(s, s); x.translate(pad, pad); fn(x); return c;
}
const PILLAR_C = ['#e8503a', '#3a7be8', '#2fa860', '#9a5ae0', '#f0a020'];
function drawPillar(c, col) {
  c.fillStyle = 'rgba(100,55,0,.25)'; rr(c, 6, 8, 44, 43, 9); c.fill();
  c.save(); rr(c, 3, 3, 42, 42, 9); c.clip();
  c.fillStyle = '#fff4dd'; c.fillRect(3, 3, 42, 42);
  c.fillStyle = col; for (let k = 0; k < 4; k += 2) c.fillRect(3 + k * 10.5, 3, 10.5, 42);
  c.fillRect(3 + 3 * 10.5 + 5, 3, 6, 42);
  // mái che có diềm tròn
  c.fillStyle = shade(col, -.18); c.fillRect(3, 3, 42, 9);
  for (let k = 0; k < 4; k++) { c.beginPath(); c.arc(3 + k * 10.5 + 5.25, 12, 5.25, 0, Math.PI); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(3, 3, 42, 3);
  const gr = c.createLinearGradient(3, 0, 45, 0); gr.addColorStop(0, 'rgba(255,255,255,.18)'); gr.addColorStop(.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.18)');
  c.fillStyle = gr; c.fillRect(3, 3, 42, 42);
  c.fillStyle = 'rgba(60,20,0,.22)'; c.fillRect(3, 38, 42, 7);
  c.restore();
  c.strokeStyle = shade(col, -.45); c.lineWidth = 2; rr(c, 3, 3, 42, 42, 9); c.stroke();
  c.fillStyle = '#ffe9a8'; circ(c, 24, 2.5, 2.6); c.strokeStyle = shade(col, -.45); c.lineWidth = 1; c.stroke();
}
function drawStone(c) {
  c.fillStyle = '#5c6676'; rr(c, 0, 0, 48, 48, 4); c.fill();
  c.fillStyle = '#8693a6'; rr(c, 1, 1, 46, 40, 5); c.fill();
  const gr = c.createLinearGradient(0, 0, 0, 40); gr.addColorStop(0, 'rgba(255,255,255,.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = gr; rr(c, 1, 1, 46, 40, 5); c.fill();
  c.strokeStyle = 'rgba(40,46,58,.45)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(2, 20.5); c.lineTo(46, 20.5); c.moveTo(24, 2); c.lineTo(24, 20); c.moveTo(12, 21); c.lineTo(12, 40); c.moveTo(36, 21); c.lineTo(36, 40); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(4, 4, 17, 3); c.fillRect(27, 4, 17, 3); c.fillRect(15, 24, 18, 3);
}
function drawCrate(c) {
  c.fillStyle = 'rgba(100,55,0,.25)'; rr(c, 6, 8, 44, 43, 8); c.fill();
  c.fillStyle = '#93582a'; rr(c, 2, 4, 44, 42, 6); c.fill();
  const gr = c.createLinearGradient(0, 2, 0, 40); gr.addColorStop(0, '#e8ae6c'); gr.addColorStop(1, '#c47f40');
  c.fillStyle = gr; rr(c, 2, 2, 44, 37, 6); c.fill();
  c.strokeStyle = '#8a5124'; c.lineWidth = 2; rr(c, 6.5, 6.5, 35, 28, 3); c.stroke();
  c.lineWidth = 1.3; c.strokeStyle = 'rgba(120,70,25,.55)';
  c.beginPath(); c.moveTo(7, 16); c.lineTo(41, 16); c.moveTo(7, 25.5); c.lineTo(41, 25.5); c.stroke();
  c.lineCap = 'round'; c.strokeStyle = '#8a5124'; c.lineWidth = 7; c.beginPath(); c.moveTo(9, 32); c.lineTo(39, 9); c.stroke();
  c.strokeStyle = '#e3a463'; c.lineWidth = 4.5; c.stroke(); c.lineCap = 'butt';
  c.fillStyle = '#5b3412'; [[9, 9], [39, 9], [9, 32], [39, 32]].forEach(([x, y]) => circ(c, x, y, 1.7));
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(7, 3.2, 34, 1.6);
  c.strokeStyle = '#6a3c17'; c.lineWidth = 2; rr(c, 2, 2, 44, 44, 6); c.stroke();
}
function drawBush(c) {
  c.fillStyle = 'rgba(60,70,0,.25)'; ell(c, 26, 41, 21, 7);
  const blobs = [[14, 30, 11], [34, 30, 11], [24, 19, 13], [11, 21, 8], [37, 21, 8], [24, 33, 11]];
  c.fillStyle = '#226b2b'; blobs.forEach(([x, y, r]) => circ(c, x, y + 1.5, r + 2));
  c.fillStyle = '#3d9d43'; blobs.forEach(([x, y, r]) => circ(c, x, y, r));
  c.fillStyle = '#5cbf52'; blobs.forEach(([x, y, r]) => circ(c, x - r * .25, y - r * .3, r * .62));
  c.fillStyle = 'rgba(200,255,160,.55)'; blobs.forEach(([x, y, r]) => circ(c, x - r * .38, y - r * .48, r * .22));
  [[16, 26, '#fff'], [31, 16, '#ffd84a'], [33, 33, '#ff8fb8'], [20, 37, '#fff']].forEach(([x, y, col]) => {
    c.fillStyle = col; for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2; circ(c, x + Math.cos(a) * 2, y + Math.sin(a) * 2, 1.5); }
    c.fillStyle = '#f5a623'; circ(c, x, y, 1.1);
  });
}
function drawSteel(c) {
  c.fillStyle = 'rgba(30,30,40,.3)'; rr(c, 6, 8, 44, 43, 6); c.fill();
  c.fillStyle = '#4d5563'; rr(c, 1, 3, 46, 44, 5); c.fill();
  const gr = c.createLinearGradient(0, 1, 48, 40); gr.addColorStop(0, '#d4dbe6'); gr.addColorStop(.5, '#9aa5b5'); gr.addColorStop(1, '#7a8596');
  c.fillStyle = gr; rr(c, 1, 1, 46, 40, 5); c.fill();
  c.save(); rr(c, 1, 1, 46, 9, 5); c.clip();
  for (let k = -2; k < 8; k++) { c.fillStyle = k % 2 ? '#22252c' : '#ffc21a'; c.beginPath(); c.moveTo(k * 8, 10); c.lineTo(k * 8 + 8, 10); c.lineTo(k * 8 + 17, 0); c.lineTo(k * 8 + 9, 0); c.fill(); }
  c.restore();
  c.fillStyle = '#5c6575'; [[7, 16], [41, 16], [7, 35], [41, 35]].forEach(([x, y]) => circ(c, x, y, 2.2));
  c.fillStyle = '#eef2f7'; [[6.4, 15.4], [40.4, 15.4], [6.4, 34.4], [40.4, 34.4]].forEach(([x, y]) => circ(c, x, y, .9));
  c.strokeStyle = '#3b414d'; c.lineWidth = 1.6; rr(c, 1, 1, 46, 46, 5); c.stroke();
}
function buildSprites() {
  SP = { crate: mkSprite(drawCrate), bush: mkSprite(drawBush), steel: mkSprite(drawSteel), stone: mkSprite(drawStone), pillar: PILLAR_C.map(col => mkSprite(c => drawPillar(c, col))) };
  // nền tĩnh: sàn cát ô bàn cờ + tường viền + cột
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const c = bg.getContext('2d'); c.scale(scale, scale);
  const rnd = mulberry32(7);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const X = x * T, Y = y * T;
    c.fillStyle = (x + y) % 2 ? '#efc47e' : '#f6d597'; c.fillRect(X, Y, T, T);
    c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(X, Y, T, 2); c.fillRect(X, Y, 2, T);
    c.fillStyle = 'rgba(150,85,10,.10)'; c.fillRect(X, Y + T - 2, T, 2); c.fillRect(X + T - 2, Y, 2, T);
    c.fillStyle = 'rgba(160,95,25,.22)';
    for (let k = 0; k < 3; k++) circ(c, X + 6 + rnd() * 36, Y + 6 + rnd() * 36, .8 + rnd() * 1.2);
  }
  // viền trong (bóng tường xuống sàn)
  c.fillStyle = 'rgba(90,50,0,.22)'; c.fillRect(T, T, W - 2 * T, 7); c.fillRect(T, T, 6, H - 2 * T);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) c.drawImage(SP.stone, x * T - 8, y * T - 8, T + 16, T + 16);
  }

const PU_NAME = { 1: '+1 bom', 2: '+1 tầm lửa', 3: 'Tăng tốc' };
function pickLocal(i) {

/* ---------- chết & phân xử ---------- */
function killMe() {
  const me = ME(); if (me.dead || G.phase === 'end') return;
  me.dead = true; me.deadT = performance.now(); me.moving = false;
  stars(me.x * T, me.y * T - 8, Shell.myColor); Shell.sfx.miss(); updPanel();
  if (Shell.isHost) { Shell.send({ t: 'die', n: G.n }); hostDeath(0); }
  else Shell.send({ t: 'dead', n: G.n, x: Math.round(me.x * 100), y: Math.round(me.y * 100) });
}
function oppDied() {
  const o = OPP(); if (o.dead) return;
  o.dead = true; o.deadT = performance.now(); o.moving = false;
  stars(o.x * T, o.y * T - 8, Shell.oppColor); Shell.sfx.hit(); updPanel();
}
function hostDeath(w) {
  if (G.phase !== 'play') return;
  G.dead.add(w);
  if (G.judgeT) return;
  G.judgeT = later(() => {
    G.judgeT = null;
    if (G.phase !== 'play') return;
    const alive = [0, 1].filter(i => !G.dead.has(i));
    const win = alive.length === 1 ? alive[0] : -1;
    const s = G.score.slice(); if (win >= 0) s[win]++;
    Shell.send({ t: 'rend', n: G.n, w: win, s }); applyRend(win, s);
  }, Math.max(380, Math.min(900, Shell.lat() * 2 + 250)));
}
function applyRend(w, s) {
  G.phase = 'end'; G.score = s.slice();
  const mi = meI();
  Shell.setScore(s[mi], s[1 - mi]); updPanel();
  const over = Math.max(s[0], s[1]) >= WIN_ROUNDS;
  const sub = s[mi] + ' – ' + s[1 - mi];
  if (w === -1) { Shell.banner('Hoà ván!', 'Cả hai cùng bị hạ', 1700); Shell.sfx.wall(); }
  else if (w === mi) { Shell.banner('Thắng ván!', sub, 1700); Shell.sfx.score(); }
  else { Shell.banner('Thua ván!', sub, 1700); Shell.sfx.miss(); }
  if (over) {
    later(() => {
      const iWin = s[mi] > s[1 - mi];
      Shell.setScore(s[mi], s[1 - mi]);
      Shell.result({ kind: iWin ? 'win' : 'lose', title: iWin ? 'Bạn thắng!' : 'Bạn thua rồi…', reason: iWin ? 'Bạn là người trụ lại cuối cùng ở ' + WIN_ROUNDS + ' ván.' : Shell.oppName + ' thắng ' + WIN_ROUNDS + ' ván trước.' });
    }, 1500);
  } else if (Shell.isHost) later(hostNewRound, 2700);
}

/* ---------- vòng đời ván ---------- */
function hostNewRound() {

}
function beginRound(seed, n, rn) {

  G.pass.clear(); G.dead.clear(); G.sdIdx = 0; G.sdOn = false; G.nextId = 1; G.lastSig = ''; G.clockS = -1;

}

function setClock(sec) {

}
function dropSteel(i, now) {
  if (G.grid[i] === STEEL) return;
  G.grid[i] = STEEL; G.drops.push({ i, t0: now, landed: false });
  const bid = G.bcell.get(i); if (bid != null) removeBomb(bid);
  G.pu[i] = 0; G.pass.delete(i);

/* ---------- vòng lặp ---------- */
function update(dt, now) {
  const me = ME(), opp = OPP();
  // di chuyển bản thân
  me.moving = false;
  if (G.phase === 'play' && !me.dead) {
    const dirs = curDirs();
    if (dirs.length) {
      me.dir = dirs[0];
      let dist = speedOf(me) * dt, moved = 0;
      while (dist > 1e-6) {
        const st = Math.min(dist, .2); dist -= st;
        let m = moveAxis(me, dirs[0], st);
        if (m < 1e-6 && dirs[1]) { m = moveAxis(me, dirs[1], st); }
        moved += m; if (m < 1e-6) break;
      }
      me.moving = moved > 0;
      if (me.moving) me.ph += dt * 15;
    }
    // bỏ quyền đi xuyên bom khi đã bước ra
    G.pass.forEach(i => { if (!G.bcell.has(i) || !overlapsCell(me, i)) G.pass.delete(i); });
    const ci = idx(cellOf(me.x), cellOf(me.y));
    if (G.pu[ci]) pickLocal(ci);
    const fe = G.fcell.get(ci); if (fe && fe > now) killMe();
    const sig = Math.round(me.x * 100) + ',' + Math.round(me.y * 100) + me.dir + (me.moving ? 1 : 0);
    if (now - G.lastSend > 66 && sig !== G.lastSig) {
      G.lastSend = now; G.lastSig = sig;
      Shell.send({ t: 'p', n: G.n, x: Math.round(me.x * 100), y: Math.round(me.y * 100), d: me.dir, m: me.moving ? 1 : 0 }, true);
    }
  }
  // đối thủ: nội suy
  if (!opp.dead) {
    const ddx = opp.tx - opp.x, ddy = opp.ty - opp.y;
    if (Math.abs(ddx) + Math.abs(ddy) > 2.5) { opp.x = opp.tx; opp.y = opp.ty; }
    else { const k = Math.min(1, dt * 14); opp.x += ddx * k; opp.y += ddy * k; }
    if (opp.moving) opp.ph += dt * 15;
  }
  // host: bom tới giờ nổ
  if (Shell.isHost && (G.phase === 'play' || G.phase === 'end')) {
    for (const b of G.bombs.values()) if (now - b.t0 >= FUSE) { hostExplode(b); break; }
  }
  // đồng hồ & đột tử
  if (G.phase === 'play') {
    const el = (now - G.roundStart) / 1000, left = Math.ceil(ROUND_T - el);
    if (left !== G.clockS) { G.clockS = left; setClock(left > 0 ? left : -1); Shell.hud({ centerSub: left > 0 ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'Đột tử!' }); if (left <= 10 && left > 0) Shell.sfx.tick(); }
    if (el > ROUND_T) {
      if (!G.sdOn) { G.sdOn = true; Shell.banner('Đột tử!', 'Khối thép đang rơi', 1500); }
      const k = Math.floor((el - ROUND_T) * 1000 / SD_STEP) + 1;
      while (G.sdIdx < Math.min(k, SPIRAL.length)) dropSteel(SPIRAL[G.sdIdx++], now);
    }
  }
  G.drops.forEach(d => {
    if (!d.landed && now - d.t0 >= SD_FALL) {
      d.landed = true; G.shake = Math.min(10, G.shake + 3); Shell.sfx.wall();
      const X = (d.i % COLS) * T + T / 2, Y = ((d.i / COLS) | 0) * T + T / 2; puff(X, Y + 14, 5, 'rgba(160,140,110,', 60, .5, 6);
      if (G.phase === 'play' && !me.dead && idx(cellOf(me.x), cellOf(me.y)) === d.i) killMe();
    }
  });
  G.flames = G.flames.filter(f => now - f.t0 < FLAME);
  G.crumbles = G.crumbles.filter(c => now - c.t0 < 480);
  G.parts = G.parts.filter(p => (p.t += dt) < p.life);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; if (p.k === 'chip') p.vy += 520 * dt; else if (p.k !== 'text') { p.vx *= .94; p.vy *= .94; } });
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 40);
}

function draw(now) {
  const s = scale, t = now / 1000;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  if (!bg) return;
  const sx = G.shake ? (Math.random() - .5) * G.shake * .6 * s : 0, sy = G.shake ? (Math.random() - .5) * G.shake * .6 * s : 0;
  cx.fillStyle = '#5c6676'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.drawImage(bg, sx, sy);
  cx.setTransform(s, 0, 0, s, sx, sy);
  const g = G.grid;
  // vật phẩm
  for (let i = 0; i < g.length; i++) if (G.pu[i] && g[i] === EMPTY) {
    const age = now - G.puT[i]; if (age < 0) continue;
    drawPu(cx, (i % COLS) * T + T / 2, ((i / COLS) | 0) * T + T / 2, G.pu[i], t, age);
  }
  // khối mềm + đổ vỡ
  for (let i = 0; i < g.length; i++) if (g[i] === SOFT) cx.drawImage(G.style[i] ? SP.bush : SP.crate, (i % COLS) * T - 8, ((i / COLS) | 0) * T - 8, T + 16, T + 16);
  G.crumbles.forEach(c => {
    const p = (now - c.t0) / 480, X = (c.i % COLS) * T + T / 2, Y = ((c.i / COLS) | 0) * T + T / 2;
    cx.save(); cx.globalAlpha = Math.max(0, 1 - p); cx.translate(X, Y + p * 8); cx.rotate((c.i % 2 ? 1 : -1) * p * .5); cx.scale(1 - p * .45, 1 - p * .6);
    cx.drawImage(c.st ? SP.bush : SP.crate, -T / 2 - 8, -T / 2 - 8, T + 16, T + 16); cx.restore();
  });
  // thép đột tử
  G.drops.forEach(d => {
    const p = Math.min(1, (now - d.t0) / SD_FALL), X = (d.i % COLS) * T, Y = ((d.i / COLS) | 0) * T;
    if (p < 1) { cx.fillStyle = `rgba(30,20,0,${.12 + p * .2})`; ell(cx, X + T / 2, Y + T - 6, 14 + p * 8, 4 + p * 3); }
    const e = p * p, off = (1 - e) * -140;
    cx.save(); cx.globalAlpha = .3 + .7 * p; cx.drawImage(SP.steel, X - 8, Y - 8 + off, T + 16, T + 16); cx.restore();
  });

  G.bombs.forEach(b => drawBomb(cx, b, now));
  // lửa
  G.flames.forEach(f => drawFlame(cx, f, now));
  // nhân vật

  order.forEach(i => {
    const p = G.P[i], col = i === 0 ? C_HOST : C_GUEST, X = p.x * T, Y = p.y * T - 4;

      drawBot(cx, 0, 0, d < .2 && Math.sin(now / 30) > 0 ? '#ffffff' : col, 'd', 0, false, t, { xeyes: true, noShadow: true });
      cx.restore(); return;
    }
    drawBot(cx, X, Y, col, p.dir, p.ph, p.moving, t, { seed: i * 3 });
    if (i === meI()) {
      const ty = Y - 46 + Math.sin(t * 5) * 1.5;
      cx.font = '800 11px "Baloo 2", system-ui, sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillStyle = 'rgba(20,20,30,.72)'; rr(cx, X - 17, ty - 8, 34, 15, 7.5); cx.fill();
      cx.beginPath(); cx.moveTo(X - 4, ty + 7); cx.lineTo(X + 4, ty + 7); cx.lineTo(X, ty + 11); cx.fill();
      cx.fillStyle = '#fff'; cx.fillText('BẠN', X, ty + .5);
    }
  });

  G.parts.forEach(p => {
    const a = 1 - p.t / p.life;
    if (p.k === 'smoke') { cx.fillStyle = p.col + (a * .45).toFixed(3) + ')'; circ(cx, p.x, p.y, p.r * (1 + p.t * 2)); }
    else if (p.k === 'chip') { cx.save(); cx.globalAlpha = Math.min(1, a * 2); cx.fillStyle = p.col; cx.translate(p.x, p.y); cx.rotate(p.rot + p.t * 10); cx.fillRect(-p.r, -p.r * .7, p.r * 2, p.r * 1.4); cx.restore(); }
    else if (p.k === 'star') { cx.globalAlpha = a; cx.fillStyle = p.col; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.t * 6); cx.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? p.r * .45 : p.r; cx.lineTo(Math.cos(k * Math.PI / 5) * r, Math.sin(k * Math.PI / 5) * r); } cx.fill(); cx.restore(); cx.globalAlpha = 1; }
    else if (p.k === 'text') { cx.globalAlpha = Math.min(1, a * 2); cx.font = '800 14px "Baloo 2", system-ui, sans-serif'; cx.textAlign = 'center'; cx.lineWidth = 3.5; cx.strokeStyle = '#fff'; cx.strokeText(p.s, p.x, p.y); cx.fillStyle = p.col; cx.fillText(p.s, p.x, p.y); cx.globalAlpha = 1; }
  });
  // phủ mờ khi chưa vào trận
  if (G.phase === 'idle') { cx.fillStyle = 'rgba(40,25,10,.25)'; cx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now;
  try { update(dt, now); draw(now); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

/* ---------- bảng bên ---------- */
function drawFace(canvas, col) {
  const r = canvas.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round((r.width || 58) * d)); if (canvas.width !== w) { canvas.width = canvas.height = w; }
  const c = canvas.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, w);
  const k = w / 58; c.setTransform(k * 1.25, 0, 0, k * 1.25, w / 2, w * .62);
  drawBot(c, 0, 0, col, 'd', 0, false, performance.now() / 1000, { noShadow: true });
}
function updPanel() {

}

const KEYS = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (!document.getElementById('shGame') || document.getElementById('shGame').classList.contains('hidden')) return;
  const d = KEYS[e.code];
  if (d) { const k = keyStack.indexOf(d); if (k >= 0) keyStack.splice(k, 1); keyStack.push(d); e.preventDefault(); return; }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyJ' || e.code === 'NumpadEnter') {
    if (document.querySelector('#shResult:not(.hidden), #shLeft:not(.hidden)')) return;
    e.preventDefault(); if (!e.repeat) placeBomb();
  }
});
addEventListener('keyup', e => { const d = KEYS[e.code]; if (d) { const k = keyStack.indexOf(d); if (k >= 0) keyStack.splice(k, 1); } });
addEventListener('blur', () => { keyStack.length = 0; touchDir = null; });
const dpad = document.getElementById('dpad');
function dpadAt(e) {
  const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  touchDir = Math.hypot(dx, dy) < 12 ? null : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
  dpad.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('on', b.classList.contains(touchDir)));
}
function dpadEnd() { touchDir = null; dpad.querySelectorAll('.tbtn').forEach(b => b.classList.remove('on')); }
dpad.addEventListener('pointerdown', e => { e.preventDefault(); try { dpad.setPointerCapture(e.pointerId); } catch (er) {} dpadAt(e); });
dpad.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') { if (dpad.hasPointerCapture && dpad.hasPointerCapture(e.pointerId)) dpadAt(e); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => dpad.addEventListener(ev, dpadEnd));
const bombBtn = document.getElementById('bombBtn');

function onMsg(m) {
  if (m.t === 'round') { if (!Shell.isHost) { G.score = m.s.slice(); Shell.setScore(m.s[1], m.s[0]); beginRound(m.seed, m.n, m.rn); } return; }
  if (m.n !== G.n) return;   // tin của ván cũ
  const opp = OPP();
  switch (m.t) {
    case 'p':
      if (opp.dead) return;
      opp.tx = m.x / 100; opp.ty = m.y / 100; opp.dir = m.d || opp.dir; opp.moving = !!m.m; break;
    case 'bomb': {
      if (Shell.isHost) return;
      if (m.r != null) {
        const pid = 'p' + m.r, pb = G.bombs.get(pid), t0 = pb ? pb.t0 : performance.now() - Shell.lat();
        if (pb) removeBomb(pid);
        addBomb({ id: m.id, x: m.x, y: m.y, o: m.o, f: m.f, t0 });
      } else { addBomb({ id: m.id, x: m.x, y: m.y, o: m.o, f: m.f, t0: performance.now() - Shell.lat() }); Shell.sfx.drop(); }
      break;
    }
    case 'nob': if (!Shell.isHost) removeBomb('p' + m.r); break;
    case 'req': if (Shell.isHost) hostReq(m); break;
    case 'ex': if (!Shell.isHost) applyEx(m); break;
    case 'pick':
      if (!Shell.isHost) return;
      if (G.pu[m.i] && G.phase !== 'idle') { const k = G.pu[m.i]; G.pu[m.i] = 0; applyPU(G.P[1], k, 1); Shell.send({ t: 'got', n: G.n, i: m.i, w: 1, k }); Shell.sfx.pick(); }
      else Shell.send({ t: 'unpick', n: G.n, k: m.k });
      break;
    case 'got':
      if (Shell.isHost) return;
      if (m.w === 0) { G.pu[m.i] = 0; applyPU(G.P[0], m.k, 1); Shell.sfx.pick(); }
      break;
    case 'unpick': if (!Shell.isHost) applyPU(ME(), m.k, -1); break;
    case 'die': if (!Shell.isHost) oppDied(); break;
    case 'dead': if (Shell.isHost) { if (m.x != null) { opp.x = opp.tx = m.x / 100; opp.y = opp.ty = m.y / 100; } oppDied(); hostDeath(1); } break;
    case 'rend': if (!Shell.isHost) applyRend(m.w, m.s); break;
  }
}

    'Thắng <b>2 ván</b> trước là thắng trận. Hết 2 phút sẽ vào <b>đột tử</b>: khối thép rơi dần từ ngoài vào.'
  ],
  keys: [[['↑', '↓', '←', '→'], 'di chuyển'], [['W', 'A', 'S', 'D'], 'di chuyển'], [['Space', 'Enter', 'J'], 'đặt bom'], ['Cảm ứng', 'phím mũi tên + nút BOM']],
